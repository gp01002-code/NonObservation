<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自我觀測儀 | SELF-OBSERVATORY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap');
        :root { --dim: rgba(255,255,255,0.4); --crt-bg: #020202; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Share Tech Mono',monospace;
            background:#000; color:#fff;
            height:100vh; overflow:hidden;
            display:flex; justify-content:center; align-items:center;
        }
        .intro-screen {
            position:fixed; inset:0; background:#000;
            display:flex; flex-direction:column;
            justify-content:center; align-items:center;
            z-index:10000; padding:20px; transition:opacity .8s ease;
        }
        .intro-screen.hidden { opacity:0; pointer-events:none; }
        .intro-title {
            font-family:'Orbitron',sans-serif;
            font-size:clamp(22px,5vw,42px);
            text-shadow:0 0 30px #fff,0 0 60px rgba(255,255,255,.3);
            margin-bottom:28px; letter-spacing:8px;
        }
        .intro-content {
            max-width:580px; text-align:center;
            color:var(--dim); font-size:13px; line-height:2;
            margin-bottom:38px; letter-spacing:1px;
        }
        .start-button {
            font-family:'Orbitron',sans-serif; padding:14px 48px;
            background:transparent; border:1px solid rgba(255,255,255,.8);
            color:#fff; font-size:15px; cursor:pointer; letter-spacing:4px;
            box-shadow:0 0 20px rgba(255,255,255,.15),inset 0 0 20px rgba(255,255,255,.03);
            transition:all .3s;
        }
        .start-button:hover {
            background:rgba(255,255,255,.05);
            box-shadow:0 0 40px rgba(255,255,255,.4),inset 0 0 30px rgba(255,255,255,.08);
        }
        .machine-wrapper {
            position:relative; width:95vw; max-width:1000px;
            aspect-ratio:1000/667; background:#0a0a0a;
            box-shadow:0 0 100px rgba(255,255,255,.04);
        }
        .machine-wrapper::before {
            content:''; position:absolute; inset:0;
            background:url('Image2.png') center/contain no-repeat;
            z-index:0; pointer-events:none;
            animation:floatBg 15s ease-in-out infinite;
        }
        .machine-wrapper::after {
            content:''; position:absolute; inset:0;
            background:url('Image.png') center/contain no-repeat;
            z-index:1; pointer-events:none;
            animation:floatFg 10s ease-in-out infinite;
        }
        @keyframes floatBg{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,3px)}}
        @keyframes floatFg{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-2px)}}
        .screen-container {
            position:absolute; top:8.5%; left:25.5%; width:49%; height:54%;
            background:var(--crt-bg); border-radius:4px; overflow:hidden; z-index:2;
            border:1px solid rgba(255,255,255,.25);
            box-shadow:0 0 0 1px rgba(255,255,255,.05),0 0 20px rgba(255,255,255,.08),inset 0 0 30px rgba(0,0,0,.8);
        }
        #mainCanvas { width:100%; height:100%; display:block; }
        .crt-overlay {
            position:absolute; inset:0;
            background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,.18) 50%),
                       linear-gradient(90deg,rgba(255,255,255,.02),rgba(255,255,255,.01),rgba(255,255,255,.02));
            background-size:100% 3px,3px 100%;
            pointer-events:none; z-index:5;
        }
        .vignette {
            position:absolute; inset:0;
            background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%);
            pointer-events:none; z-index:6;
        }
        .ui-text {
            position:absolute; padding:8px 10px;
            font-size:9px; pointer-events:none; z-index:4;
            text-transform:uppercase; color:rgba(255,255,255,.85);
            text-shadow:0 0 8px rgba(255,255,255,.5);
            line-height:1.7; letter-spacing:1px;
        }
        .ui-top-left { top:0; left:0; }
        .ui-top-left div:first-child { color:#fff; font-size:10px; font-weight:bold; text-shadow:0 0 12px #fff; }
        .ui-bottom-right { bottom:0; right:0; text-align:right; color:rgba(255,255,255,.4); font-size:8px; }
        .knob-container { position:absolute; display:flex; flex-direction:column; align-items:center; z-index:10; }
        .knob-left  { top:8%; left:6.5%;  width:15%; height:25%; }
        .knob-right { top:8%; right:6.5%; width:15%; height:25%; }
        .knob-area { width:100%; height:85%; cursor:ns-resize; position:relative; --rotation:0deg; }
        .knob-area::after {
            content:''; position:absolute; top:5%; left:50%; width:2px; height:40%;
            background:linear-gradient(to bottom,#fff,rgba(255,255,255,.3),transparent);
            transform-origin:center bottom;
            transform:translateX(-50%) rotate(var(--rotation));
            border-radius:2px; box-shadow:0 0 12px #fff,0 0 25px rgba(255,255,255,.4);
        }
        .knob-value { font-size:9px; color:rgba(255,255,255,.7); text-shadow:0 0 8px #fff; margin-top:4px; font-weight:bold; letter-spacing:1px; }
        .mode-selector {
            position:absolute; bottom:4.5%; left:26%; width:48%; height:11%;
            z-index:10; display:flex; justify-content:space-around; align-items:center;
        }
        .mode-target {
            flex:1; height:100%; cursor:pointer;
            display:flex; flex-direction:column; justify-content:center; align-items:center;
            color:var(--dim); font-size:14px; font-weight:bold;
            font-family:'Orbitron',sans-serif; letter-spacing:2px; transition:all .4s;
        }
        .mode-target::before {
            content:''; width:5px; height:5px; background:#1a1a1a;
            border:1px solid rgba(255,255,255,.1); border-radius:50%; margin-bottom:5px; transition:all .3s;
        }
        .mode-target.active { color:#fff; text-shadow:0 0 12px #fff,0 0 25px rgba(255,255,255,.5),0 0 50px rgba(255,255,255,.2); }
        .mode-target.active::before { background:#fff; box-shadow:0 0 12px #fff,0 0 25px #fff,0 0 50px rgba(255,255,255,.5); border-color:#fff; }
        .btn { position:absolute; cursor:pointer; z-index:10; border-radius:50%; }
        .btn-cam { bottom:29.5%; left:19.8%;  width:3.5%; height:5.5%; }
        .btn-run { bottom:29.5%; right:19.8%; width:3.5%; height:5.5%; }
        .light { position:absolute; width:10px; height:10px; border-radius:50%; z-index:10; background:#0a0a0a; }
        .light::after { content:attr(data-label); position:absolute; top:14px; left:50%; transform:translateX(-50%); font-size:7px; color:rgba(255,255,255,.25); white-space:nowrap; letter-spacing:1px; }
        .light-left  { bottom:22%; left:15%; }
        .light-right { bottom:22%; right:15%; }
        .light.active-red   { background:#f00; box-shadow:0 0 20px #f00,0 0 40px rgba(255,0,0,.4); animation:blink 1s infinite; }
        .light.active-green { background:#0f8; box-shadow:0 0 20px #0f8,0 0 40px rgba(0,255,136,.4); }
        @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.15}}
        #videoElement { display:none; }
    </style>
</head>
<body>

<div class="intro-screen" id="introScreen">
    <h1 class="intro-title">SELF-OBSERVATORY</h1>
    <div class="intro-content">
        <p>這是一台解析主體擬像的數位觀測儀器。</p>
        <p>系統將以膚色偵測追蹤你的面孔，並用他者容貌覆寫你的五官。</p>
        <p>旋鈕一：面具層數 &nbsp;|&nbsp; 旋鈕二：異化強度</p>
    </div>
    <button class="start-button" onclick="startExperience()">開始體驗 &nbsp;/&nbsp; START</button>
</div>

<div class="machine-wrapper">
    <div class="screen-container">
        <div class="ui-text ui-top-left">
            <div id="disp-mode">MODE: MIRROR_STAGE</div>
            <div id="disp-status">SYS: STANDBY</div>
        </div>
        <div class="ui-text ui-bottom-right" id="log-stream">AWAITING DATA...</div>
        <canvas id="mainCanvas"></canvas>
        <div class="crt-overlay"></div>
        <div class="vignette"></div>
    </div>
    <div class="knob-container knob-left">
        <div class="knob-area" id="knobDensity"></div>
        <div class="knob-value" id="valDensity">×2</div>
    </div>
    <div class="knob-container knob-right">
        <div class="knob-area" id="knobDistort"></div>
        <div class="knob-value" id="valDistort">70%</div>
    </div>
    <div class="mode-selector">
        <div class="mode-target active" onclick="setMode(1)">REFLEX</div>
        <div class="mode-target"        onclick="setMode(2)">PROCESS</div>
        <div class="mode-target"        onclick="setMode(3)">SYNTH</div>
    </div>
    <div class="btn btn-cam" id="btnCam"></div>
    <div class="btn btn-run" id="btnRun"></div>
    <div class="light light-left"  id="indGreen" data-label="CAM LINK"></div>
    <div class="light light-right" id="indRed"   data-label="SYS RUN"></div>
</div>

<video id="videoElement" autoplay playsinline></video>

<script>
// ═══════════════ SOUND ═══════════════
const SFX = { click: new Audio('sounds/click.mp3'), knob: new Audio('sounds/knob.mp3'), mode: new Audio('sounds/mode.mp3') };
Object.values(SFX).forEach(a=>{ a.volume=0.55; a.preload='auto'; });
function playSound(n){ try{ SFX[n].currentTime=0; SFX[n].play().catch(()=>{}); }catch(e){} }
let knobTimer=null;
function playKnob(){ clearTimeout(knobTimer); knobTimer=setTimeout(()=>playSound('knob'),80); }

// ═══════════════ CANVAS ═══════════════
const canvas = document.getElementById('mainCanvas');
const ctx    = canvas.getContext('2d');
const video  = document.getElementById('videoElement');
// 偵測用小尺寸畫布（160×120 足夠偵測，效能好）
const detW=160, detH=120;
const detCvs=document.createElement('canvas'); detCvs.width=detW; detCvs.height=detH;
const detCtx=detCvs.getContext('2d');

// ═══════════════ IMAGE LIBRARY ═══════════════
const TYPES=['eyes','mouth','nose','ears'];
const COUNT=50;
const pool={};
let loaded=0;
TYPES.forEach(t=>{
    pool[t]=[];
    for(let i=1;i<=COUNT;i++){
        const img=new Image();
        img.src=`facial-parts/${t}/${t}_${String(i).padStart(2,'0')}.png`;
        img.onload=()=>{ loaded++; if(loaded>=TYPES.length*COUNT) addLog("IMG DB LOADED."); };
        img.onerror=()=>{ loaded++; };
        pool[t].push(img);
    }
});

// 各部位目前顯示的圖片序號
const idx={ eyes_L:0, eyes_R:5, nose:10, mouth:15, ears_L:20, ears_R:25 };
// 定時隨機換臉
let swapIv=null;
function startSwap(ms){ clearInterval(swapIv); swapIv=setInterval(()=>{ const k=Object.keys(idx); const key=k[~~(Math.random()*k.length)]; idx[key]=~~(Math.random()*COUNT); },ms); }

// 各位置扭曲相位（獨立 sin 波）
const phase={};
Object.keys(idx).forEach(k=>{ phase[k]={ px:Math.random()*6.28, py:Math.random()*6.28, sx:.3+Math.random()*.5, sy:.2+Math.random()*.4, gt:~~(Math.random()*80), gd:0, gx:0, gy:0, gs:1 }; });

// ═══════════════ STATE ═══════════════
const S={
    running:false, cam:false, mode:1,
    layers:2, dist:0.7, frame:0, scanY:0,
    // 臉部 (平滑後)
    fx:0.5, fy:0.45, fw:0.35, fh:0.45, conf:0,
};

// ═══════════════ FACE DETECTION ═══════════════
// YCbCr 膚色偵測 → 加權質心 → 時間平滑
function detectFace(){
    if(!video.readyState||video.readyState<2) return;
    detCtx.drawImage(video,0,0,detW,detH);
    const d=detCtx.getImageData(0,0,detW,detH).data;

    let wx=0,wy=0,wt=0, x0=detW,x1=0,y0=detH,y1=0;

    for(let y=0;y<detH;y++){
        for(let x=0;x<detW;x++){
            const i=(y*detW+x)*4;
            const r=d[i],g=d[i+1],b=d[i+2];
            // YCbCr 膚色判斷（覆蓋淺/中/深膚色）
            const Y  = 0.299*r+0.587*g+0.114*b;
            const Cb =-0.169*r-0.331*g+0.500*b+128;
            const Cr = 0.500*r-0.419*g-0.081*b+128;
            if(Y>35 && Cb>=77 && Cb<=145 && Cr>=128 && Cr<=188){
                // 距離中心越近權重越高（避免背景膚色干擾）
                const nx=x/detW-.5, ny=y/detH-.5;
                const w=Math.max(0,1-Math.sqrt(nx*nx+ny*ny)*1.5);
                wx+=x*w; wy+=y*w; wt+=w;
                if(x<x0)x0=x; if(x>x1)x1=x;
                if(y<y0)y0=y; if(y>y1)y1=y;
            }
        }
    }

    const a=0.12; // Lerp 速度
    if(wt>60){
        const rx=wx/wt/detW, ry=wy/wt/detH;
        const rw=Math.max((x1-x0)/detW,0.18), rh=Math.max((y1-y0)/detH,0.22);
        S.fx+=(rx-S.fx)*a; S.fy+=(ry-S.fy)*a;
        S.fw+=(rw-S.fw)*a; S.fh+=(rh-S.fh)*a;
        S.conf=Math.min(1,S.conf+0.06);
    } else {
        // 退回中心
        S.conf=Math.max(0,S.conf-0.025);
        S.fx+=(0.5-S.fx)*0.03; S.fy+=(0.45-S.fy)*0.03;
        S.fw+=(0.35-S.fw)*0.03; S.fh+=(0.45-S.fh)*0.03;
    }
}

// ═══════════════ STARTUP ═══════════════
async function startExperience(){
    playSound('click');
    document.getElementById('introScreen').classList.add('hidden');
    addLog("INITIALIZING...");
    await toggleCam();
    if(!S.running) toggleRun();
}
function init(){ resize(); setupEvents(); requestAnimationFrame(loop); addLog("SKIN DETECT v3 READY."); }

function setupEvents(){
    document.getElementById('btnCam').addEventListener('click',()=>{ playSound('click'); toggleCam(); });
    document.getElementById('btnRun').addEventListener('click',()=>{ playSound('click'); toggleRun(); });
    setupKnob('knobDensity',v=>{ S.layers=Math.max(1,~~(1+v*3)); document.getElementById('valDensity').textContent='×'+S.layers; playKnob(); });
    setupKnob('knobDistort',v=>{ S.dist=v; document.getElementById('valDistort').textContent=~~(v*100)+'%'; playKnob(); });
    window.addEventListener('resize',resize);
}
function setupKnob(id,cb){
    let drag=false,ly=0,cur=id==='knobDensity'?.33:.7;
    const el=document.getElementById(id);
    const s=y=>{drag=true;ly=y;};
    const m=y=>{ if(!drag)return; cur=Math.min(1,Math.max(0,cur+(ly-y)*.005)); ly=y; cb(cur); el.style.setProperty('--rotation',`${cur*360}deg`); };
    const e=()=>drag=false;
    el.onmousedown=ev=>{ev.preventDefault();s(ev.clientY);};
    el.ontouchstart=ev=>{ev.preventDefault();s(ev.touches[0].clientY);};
    window.addEventListener('mousemove',ev=>m(ev.clientY));
    window.addEventListener('touchmove',ev=>m(ev.touches[0].clientY),{passive:false});
    window.addEventListener('mouseup',e); window.addEventListener('touchend',e);
    el.style.setProperty('--rotation',`${cur*360}deg`);
}
async function toggleCam(){
    if(!S.cam){
        try{
            video.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
            S.cam=true;
            document.getElementById('indGreen').classList.add('active-green');
            addLog("CAPTURE LINK: ON"); startSwap(2200);
        }catch(e){ addLog("ERR: CAM DENIED"); }
    } else {
        if(video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
        S.cam=false; clearInterval(swapIv);
        document.getElementById('indGreen').classList.remove('active-green');
        addLog("CAPTURE LINK: OFF");
    }
}
function toggleRun(){
    S.running=!S.running;
    document.getElementById('indRed').classList.toggle('active-red',S.running);
    document.getElementById('disp-status').textContent=`SYS: ${S.running?'OBSERVING':'STANDBY'}`;
    addLog(S.running?"PROC_START":"PROC_HALT");
}
function setMode(m){
    S.mode=m; playSound('mode');
    const nm=['','MIRROR_STAGE','DATA_DISCIPLINE','FACE_REWRITE'];
    document.getElementById('disp-mode').textContent=`MODE: ${nm[m]}`;
    document.querySelectorAll('.mode-target').forEach((el,i)=>el.classList.toggle('active',i===m-1));
    addLog(`STAGE_${m} ACTIVATED.`);
}

// ═══════════════ MAIN LOOP ═══════════════
function loop(){
    S.frame++;
    if(S.running&&S.cam){
        if(S.frame%3===0) detectFace();
        render();
    }
    requestAnimationFrame(loop);
}

// ═══════════════ RENDER ═══════════════
function render(){
    const W=canvas.width, H=canvas.height;
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    // 臉部畫布座標
    const fx=S.fx*W, fy=S.fy*H, fw=S.fw*W, fh=S.fh*H;
    if(S.mode===1) renderMirror(W,H,fx,fy,fw,fh);
    else if(S.mode===2) renderGrid(W,H,fx,fy,fw,fh);
    else renderRewrite(W,H,fx,fy,fw,fh);
}

// ═══════════════ STAGE 1: MIRROR ═══════════════
function renderMirror(W,H,fx,fy,fw,fh){
    ctx.save(); ctx.globalAlpha=.5; ctx.scale(-1,1); ctx.drawImage(video,-W,0,W,H); ctx.restore(); ctx.globalAlpha=1;

    // 掃描線
    S.scanY=(S.scanY+3)%H;
    const tr=ctx.createLinearGradient(0,S.scanY-70,0,S.scanY);
    tr.addColorStop(0,'rgba(255,255,255,0)'); tr.addColorStop(1,'rgba(255,255,255,.07)');
    ctx.fillStyle=tr; ctx.fillRect(0,S.scanY-70,W,70);
    ctx.save(); ctx.shadowBlur=18; ctx.shadowColor='#fff'; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(0,S.scanY); ctx.lineTo(W,S.scanY); ctx.stroke(); ctx.restore();

    // 偵測信心 HUD
    const c=S.conf;
    const clr=c>.6?'#0f8':c>.2?'#ff0':'#f55';
    ctx.save(); ctx.fillStyle=clr; ctx.font='8px Share Tech Mono'; ctx.shadowBlur=8; ctx.shadowColor=clr;
    ctx.fillText(`FACE ${c>.5?'LOCKED':'SEARCH'} ${~~(c*100)}%`, 8, H-10); ctx.restore();

    if(c<0.12) return;

    // 動態追蹤框（大小跟著 fw/fh 走）
    const bx=fx-fw*.58, by=fy-fh*.55, bw=fw*1.16, bh=fh*1.1, cs=14;
    ctx.save(); ctx.globalAlpha=.4+c*.5;
    ctx.strokeStyle=c>.5?'rgba(0,255,136,.9)':'rgba(255,255,80,.7)';
    ctx.shadowBlur=18; ctx.shadowColor=c>.5?'#0f8':'#ff0'; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(bx+cs,by); ctx.lineTo(bx+bw-cs,by);
    ctx.moveTo(bx+bw,by+cs); ctx.lineTo(bx+bw,by+bh-cs);
    ctx.moveTo(bx+bw-cs,by+bh); ctx.lineTo(bx+cs,by+bh);
    ctx.moveTo(bx,by+bh-cs); ctx.lineTo(bx,by+cs); ctx.stroke();
    ctx.lineWidth=2;
    [[bx,by,cs,0,0,cs],[bx+bw,by,-cs,0,0,cs],[bx+bw,by+bh,-cs,0,0,-cs],[bx,by+bh,cs,0,0,-cs]].forEach(([px,py,ax,_,bx2,by2])=>{
        ctx.beginPath(); ctx.moveTo(px+ax,py); ctx.lineTo(px,py); ctx.lineTo(px+bx2,py+by2); ctx.stroke();
    });

    // 五官骨架（比例基於偵測到的 fw/fh）
    const pts={
        eL:{x:fx-fw*.25,y:fy-fh*.15}, eR:{x:fx+fw*.25,y:fy-fh*.15},
        nT:{x:fx,       y:fy+fh*.06},
        mL:{x:fx-fw*.19,y:fy+fh*.25}, mR:{x:fx+fw*.19,y:fy+fh*.25},
    };
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=.8; ctx.shadowBlur=8; ctx.shadowColor='#fff';
    ctx.beginPath();
    ctx.moveTo(pts.eL.x,pts.eL.y); ctx.lineTo(pts.eR.x,pts.eR.y);
    ctx.moveTo(pts.eL.x,pts.eL.y); ctx.lineTo(pts.nT.x,pts.nT.y); ctx.moveTo(pts.eR.x,pts.eR.y); ctx.lineTo(pts.nT.x,pts.nT.y);
    ctx.moveTo(pts.nT.x,pts.nT.y); ctx.lineTo(pts.mL.x,pts.mL.y); ctx.moveTo(pts.mL.x,pts.mL.y); ctx.lineTo(pts.mR.x,pts.mR.y);
    ctx.moveTo(pts.mR.x,pts.mR.y); ctx.lineTo(pts.nT.x,pts.nT.y); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.85)';
    Object.values(pts).forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,Math.PI*2); ctx.fill(); });
    ctx.restore();
}

// ═══════════════ STAGE 2: DATA GRID ═══════════════
function renderGrid(W,H,fx,fy,fw,fh){
    ctx.save(); ctx.globalAlpha=.3; ctx.scale(-1,1); ctx.drawImage(video,-W,0,W,H); ctx.restore(); ctx.globalAlpha=1;
    ctx.fillStyle='rgba(0,0,0,.70)'; ctx.fillRect(0,0,W,H);

    const GS=22;
    for(let gx=0;gx<W;gx+=GS){
        for(let gy=0;gy<H;gy+=GS){
            const cx=gx+GS/2, cy=gy+GS/2;
            // 橢圓距離：以偵測到的臉部區域為前景
            const ex=(cx-fx)/(fw*.65), ey=(cy-fy)/(fh*.58);
            const ed=Math.sqrt(ex*ex+ey*ey);
            const face=ed<1;
            let hue,sat,lum,al,lw;
            if(face){
                const dep=Math.max(0,1-ed);
                hue=28+dep*32; sat=75+dep*18; lum=42+dep*32; al=.5+dep*.42; lw=.9;
            } else {
                const bg=Math.min((ed-1)/2.5,1);
                hue=200+bg*60; sat=55-bg*22; lum=18+bg*10; al=.14+(1-bg)*.18; lw=.4;
            }
            ctx.strokeStyle=`hsla(${hue},${sat}%,${lum}%,${al})`; ctx.lineWidth=lw;
            ctx.strokeRect(gx,gy,GS,GS);
            const sp=face?.91:.97;
            if(Math.random()>sp){
                ctx.fillStyle=`hsla(${hue},${sat}%,${lum+20}%,${al+.35})`;
                ctx.font=`${face?9:7}px Share Tech Mono`;
                ctx.fillText(Math.random().toString(16).slice(2,4).toUpperCase(),gx+4,gy+14);
            }
        }
    }
    // 臉部光暈
    const rg=ctx.createRadialGradient(fx,fy,5,fx,fy,fw*.75);
    rg.addColorStop(0,'rgba(255,190,80,.13)'); rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
}

// ═══════════════ STAGE 3: FACE REWRITE ═══════════════
// 各部位相對臉部的偏移比例與顯示尺寸比例
const LAYOUT={
    ears_L: {ox:-.62,oy:.00,sw:.30,sh:.52,rot:-.14,skX:.18,z:.15},
    ears_R: {ox: .62,oy:.00,sw:.30,sh:.52,rot: .14,skX:-.18,z:.15},
    nose:   {ox: .00,oy:.10,sw:.40,sh:.42,rot: .00,skX:.00,z:.80},
    eyes_L: {ox:-.28,oy:-.16,sw:.44,sh:.22,rot:.00,skX:.00,z:.65},
    eyes_R: {ox: .28,oy:-.16,sw:.44,sh:.22,rot:.00,skX:.00,z:.65},
    mouth:  {ox: .00,oy:.30,sw:.54,sh:.24,rot:.00,skX:.00,z:.70},
};
const PCOL={
    eyes_L:'#00eeff',eyes_R:'#00eeff',
    nose:'#ff44cc',mouth:'#ffcc00',
    ears_L:'#88aaff',ears_R:'#88aaff',
};
const ORDER=['ears_L','ears_R','nose','eyes_L','eyes_R','mouth'];

function renderRewrite(W,H,fx,fy,fw,fh){
    const t=S.frame*.016, dist=S.dist;

    // 原臉殘影
    ctx.save(); ctx.globalAlpha=.15+dist*.04; ctx.scale(-1,1); ctx.drawImage(video,-W,0,W,H); ctx.restore(); ctx.globalAlpha=1;

    // 信心太低 → 顯示提示
    if(S.conf<0.08){
        ctx.save(); ctx.globalAlpha=.4+Math.sin(t*3)*.2;
        ctx.fillStyle='#ff4'; ctx.font='bold 11px Orbitron'; ctx.textAlign='center';
        ctx.shadowBlur=15; ctx.shadowColor='#ff4';
        ctx.fillText('FACE SEARCHING...',W/2,H/2);
        ctx.font='9px Share Tech Mono'; ctx.fillText('請靠近攝影機或增加光源',W/2,H/2+22);
        ctx.textAlign='start'; ctx.restore();
        return;
    }

    ORDER.forEach(key=>{
        const L=LAYOUT[key];
        const [tp]=key.split('_');
        const imgs=pool[tp];
        if(!imgs) return;
        const img=imgs[idx[key]%imgs.length];
        if(!img||!img.complete||img.naturalWidth===0) return;

        const ph=phase[key];
        // 基礎位置
        const bx=fx+L.ox*fw, by=fy+L.oy*fh;
        // 顯示尺寸
        const dw=L.sw*fw, dh=L.sh*fh;
        // 異化波動
        const ax=dist*13, ay=dist*7;

        for(let layer=0;layer<S.layers;layer++){
            const lp=(layer/Math.max(S.layers-1,1))*Math.PI;
            const la=layer===0?.88:Math.max(.08,.36-layer*.09);
            const wx=Math.sin(t*ph.sx+ph.px+lp)*ax*(layer+1);
            const wy=Math.cos(t*ph.sy+ph.py+lp)*ay*(layer+1);

            // Glitch
            ph.gt--;
            if(ph.gt<=0){
                ph.gt=55+~~(Math.random()*170);
                ph.gx=(Math.random()-.5)*dist*38; ph.gy=(Math.random()-.5)*dist*14;
                ph.gs=1+(Math.random()-.5)*dist*.38; ph.gd=3+~~(Math.random()*5);
            }
            const gl=ph.gd>0; if(gl) ph.gd--;

            const px=bx+wx+(gl?ph.gx:0);
            const py=by+wy+(gl?ph.gy:0);
            const sw=dw*(1+layer*.05), sh=dh*(1+layer*.05);
            const gsx=gl?ph.gs:1;
            const z=L.z;
            const col=PCOL[key]||'#fff';
            const glow=layer===0?(8+z*16+dist*9):(4+z*7);

            ctx.save();
            ctx.translate(px,py);
            ctx.scale(gsx,1);
            if(L.rot!==0) ctx.rotate(L.rot);
            if(L.skX!==0) ctx.transform(1,0,L.skX*(1-dist*.25),1,0,0);
            if(layer>0) ctx.rotate(Math.sin(t*.2+ph.px+layer)*dist*.06);

            // 立體投影陰影
            ctx.shadowOffsetX=z*3*(1+layer); ctx.shadowOffsetY=z*4*(1+layer);
            ctx.shadowBlur=glow+4; ctx.shadowColor='rgba(0,0,0,0.65)';
            ctx.globalAlpha=la;
            ctx.drawImage(img,-sw/2,-sh/2,sw,sh);

            // 彩色外發光
            ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
            ctx.shadowBlur=glow*.65; ctx.shadowColor=col;
            ctx.strokeStyle=col+(layer===0?',0.65)':',0.28)').replace('#','rgba(');
            // 解析 hex color 轉 rgba
            const r=parseInt(col.slice(1,3),16), g=parseInt(col.slice(3,5),16), b=parseInt(col.slice(5,7),16);
            ctx.strokeStyle=`rgba(${r},${g},${b},${layer===0?.65:.25})`;
            ctx.lineWidth=layer===0?.9:.35;
            ctx.strokeRect(-sw/2,-sh/2,sw,sh);

            if(layer===0){
                const cs=6,hx=sw/2,hy=sh/2;
                ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.shadowBlur=8;
                ctx.beginPath();
                ctx.moveTo(-hx,-hy+cs); ctx.lineTo(-hx,-hy); ctx.lineTo(-hx+cs,-hy);
                ctx.moveTo( hx-cs,-hy); ctx.lineTo( hx,-hy); ctx.lineTo( hx,-hy+cs);
                ctx.moveTo( hx, hy-cs); ctx.lineTo( hx, hy); ctx.lineTo( hx-cs, hy);
                ctx.moveTo(-hx+cs, hy); ctx.lineTo(-hx, hy); ctx.lineTo(-hx, hy-cs);
                ctx.stroke();
                ctx.fillStyle=col; ctx.font='7px Orbitron'; ctx.shadowBlur=5;
                ctx.fillText(key.replace('_',' ').toUpperCase(),-hx,-hy-4);
            }
            if(gl&&dist>.2){
                ctx.strokeStyle=`rgba(${r},${g},${b},.45)`; ctx.lineWidth=.8;
                ctx.globalCompositeOperation='screen';
                const lly=-sh/2+Math.random()*sh;
                ctx.beginPath(); ctx.moveTo(-sw/2,lly); ctx.lineTo(sw/2,lly); ctx.stroke();
                ctx.globalCompositeOperation='source-over';
            }
            ctx.restore();
        }
    });

    // 準線
    ctx.save(); ctx.globalAlpha=.28+S.conf*.2;
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=.6;
    ctx.shadowBlur=5; ctx.shadowColor='#fff';
    ctx.beginPath(); ctx.moveTo(fx-12,fy); ctx.lineTo(fx+12,fy); ctx.moveTo(fx,fy-12); ctx.lineTo(fx,fy+12); ctx.stroke();
    ctx.globalAlpha=.06+S.conf*.08; ctx.setLineDash([4,8]);
    ctx.beginPath(); ctx.ellipse(fx,fy,fw*.55,fh*.52,0,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
}

// ═══════════════ UTILS ═══════════════
function addLog(msg){
    const el=document.getElementById('log-stream');
    el.innerHTML=`<span style="color:rgba(255,255,255,.4)">></span> ${msg}<br>${el.innerHTML.split('<br>').slice(0,2).join('<br>')}`;
}
function resize(){
    const c=document.querySelector('.screen-container');
    if(c){ canvas.width=c.clientWidth; canvas.height=c.clientHeight; }
}
window.onload=init;
</script>
