<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自我觀測儀 | 黑白高亮 3D 重構版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap');
        
        :root {
            --glow-color: #ffffff;     
            --glow-bright: #ffffff;    
            --text-dim: rgba(255, 255, 255, 0.4);
            --crt-bg: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: #000;
            color: var(--glow-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- 開場說明頁面 --- */
        .intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
            opacity: 1;
            transition: opacity 0.8s ease;
        }
        .intro-screen.hidden { opacity: 0; pointer-events: none; }

        .intro-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(24px, 5vw, 42px);
            color: #fff;
            text-shadow: 0 0 20px #fff;
            margin-bottom: 30px;
            letter-spacing: 5px;
        }

        .intro-content {
            max-width: 600px;
            text-align: center;
            color: var(--text-dim);
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        .start-button {
            font-family: 'Orbitron', sans-serif;
            padding: 15px 40px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        .start-button:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px #fff;
        }

        /* --- 主機器介面 --- */
        .machine-wrapper {
            position: relative;
            width: 95vw;
            max-width: 1000px;
            aspect-ratio: 1000 / 667; 
            background-color: #111;
            box-shadow: 0 0 80px rgba(255, 255, 255, 0.05);
        }
        
        .machine-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('Image2.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            pointer-events: none;
            animation: floatBackground 15s ease-in-out infinite;
        }
        
        .machine-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('Image.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            pointer-events: none;
            animation: floatForeground 10s ease-in-out infinite;
        }
        
        @keyframes floatBackground { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(-8px, 4px); } }
        @keyframes floatForeground { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(4px, -3px); } }

        .screen-container {
            position: absolute;
            top: 8.5%; left: 25.5%; width: 49%; height: 54%;
            background: var(--crt-bg);
            border-radius: 4px;
            overflow: hidden;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #mainCanvas { width: 100%; height: 100%; display: block; }

        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* 旋鈕 */
        .knob-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .knob-left { top: 8%; left: 6.5%; width: 15%; height: 25%; }
        .knob-right { top: 8%; right: 6.5%; width: 15%; height: 25%; }

        .knob-area {
            width: 100%; height: 85%;
            cursor: ns-resize; 
            position: relative;
            --rotation: 0deg;
        }
        .knob-area::after {
            content: '';
            position: absolute;
            top: 5%; left: 50%; width: 3px; height: 40%;
            background: linear-gradient(to bottom, #fff, #888, transparent);
            transform-origin: center bottom;
            transform: translateX(-50%) rotate(var(--rotation));
            border-radius: 2px;
            box-shadow: 0 0 15px #fff;
        }

        .knob-value { 
            font-size: 10px; 
            color: #fff; 
            text-shadow: 0 0 10px #fff; 
            margin-top: 5px; 
            font-weight: bold;
        }

        /* 模式切換 */
        .mode-selector {
            position: absolute;
            bottom: 4.5%; left: 26%;
            width: 48%; height: 11%;
            z-index: 10;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        
        .mode-target { 
            flex: 1; 
            height: 100%;
            cursor: pointer; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-dim);
            font-size: 17px; 
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            transition: all 0.4s ease;
            position: relative;
        }

        .mode-target::before {
            content: '';
            width: 6px; height: 6px;
            background: #222;
            border-radius: 50%;
            margin-bottom: 6px;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mode-target.active {
            color: #ffffff;
            text-shadow: 0 0 15px #fff, 0 0 30px rgba(255, 255, 255, 0.5);
        }

        .mode-target.active::before {
            background: #ffffff;
            box-shadow: 0 0 15px #fff, 0 0 30px #fff;
        }

        /* 功能按鈕 */
        .btn { position: absolute; cursor: pointer; z-index: 10; border-radius: 50%; }
        .btn-cam { bottom: 29.5%; left: 19.8%; width: 3.5%; height: 5.5%; }
        .btn-run { bottom: 29.5%; right: 19.8%; width: 3.5%; height: 5.5%; }

        /* 指示燈 */
        .light { 
            position: absolute; 
            width: 10px; height: 10px; 
            border-radius: 50%; 
            z-index: 10; 
            background: #100;
        }
        
        .light::after {
            content: attr(data-label);
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            color: rgba(255, 255, 255, 0.3);
            white-space: nowrap;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .light-left { bottom: 22%; left: 15%; }
        .light-right { bottom: 22%; right: 15%; }
        
        .light.active-red { background: #f00; box-shadow: 0 0 15px #f00, 0 0 30px #f00; animation: blink 1s infinite; }
        .light.active-green { background: #0f8; box-shadow: 0 0 15px #0f8, 0 0 25px #0f8; }

        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0.2; } }

        .ui-text { 
            position: absolute; 
            padding: 12px; 
            font-size: 10px; 
            pointer-events: none; 
            z-index: 4; 
            text-transform: uppercase; 
            color: #fff;
            text-shadow: 0 0 10px #fff; 
        }
        .ui-top-left { top: 0; left: 0; }
        .ui-bottom-right { bottom: 0; right: 0; text-align: right; opacity: 0.8; }

        #videoElement { display: none; }
    </style>
</head>
<body>

    <!-- 開場說明頁面 -->
    <div class="intro-screen" id="introScreen">
        <h1 class="intro-title">SELF-OBSERVATORY</h1>
        <div class="intro-content">
            <p>這是一台解析主體擬像的數位觀測儀器。</p>
            <p>點擊「開始」後，系統將自動啟動攝影機與觀測循環。</p>
            <p>您可以透過機身上的旋鈕調整碎片密度，並切換三種觀測模式。</p>
        </div>
        <button class="start-button" onclick="startExperience()">開始體驗 / START</button>
    </div>

    <div class="machine-wrapper" id="machine">
        <div class="screen-container">
            <div class="ui-text ui-top-left">
                <div id="disp-mode">MODE: MIRROR_STAGE</div>
                <div id="disp-status">SYS: STANDBY</div>
            </div>
            <div class="ui-text ui-bottom-right" id="log-stream">
                CORE SYSTEM INITIALIZED...
            </div>
            <canvas id="mainCanvas"></canvas>
            <div class="crt-overlay"></div>
        </div>

        <div class="knob-container knob-left">
            <div class="knob-area" id="knobDensity"></div>
            <div class="knob-value" id="valDensity">12</div>
        </div>

        <div class="knob-container knob-right">
            <div class="knob-area" id="knobDistort"></div>
            <div class="knob-value" id="valDistort">70%</div>
        </div>
        
        <div class="mode-selector">
            <div class="mode-target active" onclick="setMode(1)">REFLEX</div>
            <div class="mode-target" onclick="setMode(2)">PROCESS</div>
            <div class="mode-target" onclick="setMode(3)">SYNTH</div>
        </div>

        <div class="btn btn-cam" id="btnCam"></div>
        <div class="btn btn-run" id="btnRun"></div>

        <div class="light light-left" id="indGreen" data-label="CAM LINK"></div>
        <div class="light light-right" id="indRed" data-label="SYS RUN"></div>
    </div>

    <video id="videoElement" autoplay playsinline></video>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('videoElement');
        const captureCanvas = document.createElement('canvas');
        const captureCtx = captureCanvas.getContext('2d');
        
        const state = {
            isRunning: false,
            cameraActive: false,
            currentMode: 1,
            density: 12,
            distortion: 0.7,
            frameCount: 0,
            scanProgress: 0,
            facialFragments: [],
            faceCenter: { x: 0.5, y: 0.45 },
            headTiltX: 0,
            headTiltY: 0
        };

        // ==================== 自動化開啟邏輯 ====================
        async function startExperience() {
            // 隱藏說明頁面
            document.getElementById('introScreen').classList.add('hidden');
            
            addLog("STARTING AUTOMATIC INITIALIZATION...");
            
            // 1. 自動開啟攝影機
            await toggleCamera();
            
            // 2. 自動開啟系統運作
            if (!state.isRunning) {
                toggleSystem();
            }
            
            addLog("ALL SYSTEMS GO.");
        }

        function init() {
            resize();
            captureCanvas.width = 640;
            captureCanvas.height = 480;
            setupEvents();
            requestAnimationFrame(loop);
            addLog("3D CORE ENGINE READY.");
        }

        function setupEvents() {
            document.getElementById('btnCam').onclick = toggleCamera;
            document.getElementById('btnRun').onclick = toggleSystem;
            
            setupKnob('knobDensity', (val) => {
                state.density = Math.floor(8 + val * 24);
                document.getElementById('valDensity').textContent = state.density;
            });
            
            setupKnob('knobDistort', (val) => {
                state.distortion = val;
                document.getElementById('valDistort').textContent = Math.floor(val*100) + '%';
            });

            window.addEventListener('resize', resize);
        }

        function setupKnob(id, callback) {
            let isDragging = false;
            let lastY = 0;
            const el = document.getElementById(id);
            let currentVal = (id === 'knobDensity') ? 0.167 : 0.7;

            const startDrag = (y) => { isDragging = true; lastY = y; };
            const doDrag = (y) => {
                if (!isDragging) return;
                let delta = (lastY - y) * 0.005;
                currentVal = Math.min(1, Math.max(0, currentVal + delta));
                lastY = y;
                callback(currentVal);
                el.style.setProperty('--rotation', `${currentVal * 360}deg`);
            };
            const endDrag = () => { isDragging = false; };

            el.onmousedown = (e) => { e.preventDefault(); startDrag(e.clientY); };
            el.ontouchstart = (e) => { e.preventDefault(); startDrag(e.touches[0].clientY); };

            window.addEventListener('mousemove', (e) => doDrag(e.clientY));
            window.addEventListener('touchmove', (e) => doDrag(e.touches[0].clientY), { passive: false });
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);

            el.style.setProperty('--rotation', `${currentVal * 360}deg`);
        }

        async function toggleCamera() {
            if (!state.cameraActive) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    state.cameraActive = true;
                    document.getElementById('indGreen').classList.add('active-green');
                    addLog("CAPTURE LINK: ON");
                } catch (e) { addLog("ERR: ACCESS DENIED"); }
            } else {
                if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                state.cameraActive = false;
                document.getElementById('indGreen').classList.remove('active-green');
                addLog("CAPTURE LINK: OFF");
            }
        }

        function toggleSystem() {
            state.isRunning = !state.isRunning;
            document.getElementById('indRed').classList.toggle('active-red', state.isRunning);
            document.getElementById('disp-status').textContent = `SYS: ${state.isRunning ? 'OBSERVING' : 'STANDBY'}`;
            if(state.isRunning && state.currentMode === 3) buildFragments();
            addLog(state.isRunning ? "INITIATING SCAN..." : "SCAN PAUSED.");
        }

        function setMode(m) {
            state.currentMode = m;
            const names = ["", "MIRROR_STAGE", "DATA_DISCIPLINE", "HYPERREAL_SIM"];
            document.getElementById('disp-mode').textContent = `MODE: ${names[m]}`;
            document.querySelectorAll('.mode-target').forEach((el, i) => el.classList.toggle('active', i === m-1));
            if(m === 3 && state.isRunning) buildFragments();
            addLog(`STAGE_${m} ACTIVATED.`);
        }

        function detectFace() {
            if (!video.readyState || video.readyState < 2) return;
            captureCtx.drawImage(video, 0, 0, 640, 480);
            const data = captureCtx.getImageData(0, 0, 640, 480).data;
            let maxB = 0, bX = 320, bY = 240;
            for (let i = 0; i < data.length; i += 1000) {
                let b = (data[i] + data[i+1] + data[i+2]) / 3;
                if(b > maxB) { maxB = b; let p = i / 4; bX = p % 640; bY = Math.floor(p / 640); }
            }
            state.faceCenter.x = bX / 640; state.faceCenter.y = bY / 480;
            state.headTiltX = (state.faceCenter.x - 0.5) * 2; state.headTiltY = (state.faceCenter.y - 0.45) * 2;
        }

        function buildFragments() {
            if(!state.cameraActive) return;
            state.facialFragments = [];
            for (let i = 0; i < state.density; i++) {
                const fw = 80 + Math.random() * 100, fh = 50 + Math.random() * 50;
                const fCanvas = document.createElement('canvas');
                fCanvas.width = fw; fCanvas.height = fh;
                const fCtx = fCanvas.getContext('2d');
                fCtx.drawImage(video, Math.random()*(640-fw), Math.random()*(480-fh), fw, fh, 0, 0, fw, fh);
                state.facialFragments.push({
                    canvas: fCanvas, x: Math.random() * canvas.width, y: Math.random() * canvas.height, z: Math.random() * 400 - 200,
                    vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, vz: (Math.random()-0.5)*3,
                    rotY: Math.random()*360, rs: (Math.random()-0.5)*2
                });
            }
        }

        function loop() {
            if (state.isRunning && state.cameraActive) { detectFace(); render(); }
            requestAnimationFrame(loop);
        }

        function render() {
            const w = canvas.width, h = canvas.height;
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);

            if (state.currentMode === 1) {
                ctx.globalAlpha = 0.3; ctx.save(); ctx.scale(-1, 1); ctx.drawImage(video, -w, 0, w, h); ctx.restore();
                ctx.globalAlpha = 1;
                state.scanProgress = (state.scanProgress + 3) % h;
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
                ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
                ctx.beginPath(); ctx.moveTo(0, state.scanProgress); ctx.lineTo(w, state.scanProgress); ctx.stroke();
                ctx.shadowBlur = 0;
            } 
            else if (state.currentMode === 2) {
                ctx.save(); ctx.scale(-1, 1); ctx.drawImage(video, -w, 0, w, h); ctx.restore();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(0,0,w,h);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                for(let i=0; i<w; i+=25) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
            }
            else if (state.currentMode === 3) {
                ctx.globalAlpha = 0.4; ctx.save(); ctx.scale(-1, 1); ctx.drawImage(video, -w, 0, w, h); ctx.restore();
                const focalLength = 600;
                state.facialFragments.forEach(f => {
                    f.x += f.vx; f.y += f.vy; f.z += f.vz; f.rotY += f.rs;
                    if(f.x < 0 || f.x > w) f.vx *= -1; if(f.y < 0 || f.y > h) f.vy *= -1; if(f.z < -200 || f.z > 200) f.vz *= -1;
                    const perspective = focalLength / (focalLength + f.z);
                    const drawX = f.x + state.headTiltX * 40;
                    const drawY = f.y + state.headTiltY * 20;
                    ctx.save();
                    ctx.translate(drawX, drawY);
                    ctx.scale(perspective, perspective);
                    ctx.transform(Math.cos(f.rotY * 0.017), 0, 0, 1, 0, 0);
                    ctx.globalAlpha = 0.9;
                    ctx.drawImage(f.canvas, -f.canvas.width/2, -f.canvas.height/2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.strokeRect(-f.canvas.width/2, -f.canvas.height/2, f.canvas.width, f.canvas.height);
                    ctx.restore();
                });
            }
        }

        function addLog(msg) {
            const el = document.getElementById('log-stream');
            el.innerHTML = msg + "<br>" + el.innerHTML.split('<br>').slice(0, 1).join('<br>');
        }

        function resize() {
            const container = document.querySelector('.screen-container');
            if(container) { canvas.width = container.clientWidth; canvas.height = container.clientHeight; }
        }

        window.onload = init;
    </script>
</body>
</html>
