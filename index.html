<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自我觀測儀|SELF-OBSERVATORY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
:root{
  --dim:rgba(255,255,255,0.38);
  --crt:#020202;
  --g:#00FF88;
  --w:#F0;
  --c:#00AAFF;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Share Tech Mono',monospace;
  background:#000;color:#fff;
  height:100vh;overflow:hidden;
  display:flex;justify-content:center;align-items:center;
}

/* ── INTRO ── */
.intro{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;
  justify-content:center;align-items:center;z-index:9999;padding:24px;transition:opacity .8s;}
.intro.off{opacity:0;pointer-events:none;}
.intro h1{font-family:'Orbitron',sans-serif;font-size:clamp(18px,4vw,38px);letter-spacing:8px;
  text-shadow:0 0 28px #fff,0 0 55px rgba(255,255,255,.25);margin-bottom:18px;}
.intro p{color:var(--dim);font-size:12px;line-height:1.9;text-align:center;max-width:560px;margin-bottom:6px;letter-spacing:.5px;}
.intro button{margin-top:28px;font-family:'Orbitron',sans-serif;padding:13px 46px;
  background:transparent;border:1px solid rgba(255,255,255,.75);color:#fff;
  font-size:14px;cursor:pointer;letter-spacing:4px;
  box-shadow:0 0 18px rgba(255,255,255,.12);transition:all .3s;}
.intro button:hover{background:rgba(255,255,255,.06);box-shadow:0 0 36px rgba(255,255,255,.35);}

/* ── MACHINE ── */
.mw{
  position:relative;width:95vw;max-width:1100px;aspect-ratio:1100/680;
  background:#090909;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.10),0 1px 0 rgba(255,255,255,.14),
             0 8px 24px rgba(0,0,0,.85),0 24px 60px rgba(0,0,0,.72);
}

/* ── LAYERS ── */
#layerBg{position:absolute;inset:0;background:url('Image2.png') center/contain no-repeat;z-index:0;pointer-events:none;}

/* 修正後的齒輪：放大至 22% 並精確對齊圓心 */
#layerGear{
  position:absolute;
  left: 11.2%; top: 18.5%; 
  width: 22%; height: 22%;
  background:url('Image3.png') center/contain no-repeat;
  z-index:8;pointer-events:none;
  transform: translate(-50%, -50%);
  transform-origin: center center;
}
#layerGearR{
  position:absolute;
  right: 11.2%; top: 18.5%;
  width: 22%; height: 22%;
  background:url('Image3.png') center/contain no-repeat;
  z-index:8;pointer-events:none;
  transform: translate(50%, -50%);
  transform-origin: center center;
}

#layerFg{position:absolute;inset:0;background:url('Image.png') center/contain no-repeat;z-index:3;pointer-events:none;animation:fgf 10s ease-in-out infinite;}
@keyframes fgf{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-1px)}}

/* ── MAIN SCREEN ── */
.sc{position:absolute;top:8.5%;left:25.5%;width:49%;height:54%;
  background:var(--crt);border-radius:4px;overflow:hidden;z-index:5;
  border:1px solid rgba(255,255,255,0.22);
  box-shadow:0 0 18px rgba(255,255,255,.07),inset 0 0 28px rgba(0,0,0,.8);}
#cv{width:100%;height:100%;display:block;}
.crt{position:absolute;inset:0;
  background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,.18) 50%),
             linear-gradient(90deg,rgba(255,255,255,.015),rgba(255,255,255,.008),rgba(255,255,255,.015));
  background-size:100% 3px,3px 100%;pointer-events:none;z-index:5;}
.vig{position:absolute;inset:0;
  background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.78) 100%);
  pointer-events:none;z-index:6;}

/* ── PANELS (向外偏移，離螢幕遠一點) ── */
#infoPanel{
  position:absolute;
  top:36%;left:9%;width:13%;bottom:37.5%; /* left 從 12% 降到 9% */
  background:rgba(0,0,0,.80);border:1px solid rgba(255,255,255,0.08);
  border-radius:3px;z-index:20;overflow:hidden;display:flex;flex-direction:column;
}
#gazePanel{
  position:absolute;
  top:36%;right:9%;width:13%;bottom:37.5%; /* right 從 12% 降到 9% */
  background:rgba(0,0,0,.88);border:1px solid rgba(0,255,136,0.18);
  border-radius:3px;z-index:20;overflow:hidden;display:flex;flex-direction:column;
}

/* ── KNOBS (同步向外移動) ── */
.kc{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:20;}
.kl{top:8%;left:9%;width:13%;height:25%;}
.kr{top:8%;right:9%;width:13%;height:25%;}
.ka{width:100%;height:82%;cursor:grab;display:block;}
.kv{font-size:clamp(11px,1.6vw,16px);color:rgba(255,255,255,.92);
  text-shadow:0 0 12px #fff;margin-top:10%;font-weight:bold;font-family:'Orbitron',sans-serif;}

/* ── 其餘結構保持不變 ── */
#infoHeader, #gazeHeader{padding:3px 6px;font-size:7px;letter-spacing:1.5px;border-bottom:1px solid rgba(255,255,255,0.06);}
#infoBody, #gazeFeed{flex:1;padding:4px 5px;font-size:7px;line-height:1.65;overflow:hidden;}
.ge-row{font-size:7px;line-height:1.55;}

.ms{position:absolute;bottom:30%;left:26%;width:48%;height:9%;z-index:20;display:flex;justify-content:space-around;align-items:center;}
.mt{flex:1;cursor:pointer;text-align:center;color:var(--dim);font-size:11px;font-family:'Orbitron',sans-serif;letter-spacing:2px;transition:0.4s;}
.mt.on{color:#fff;text-shadow:0 0 11px #fff;}

.btn{position:absolute;cursor:pointer;z-index:20;border-radius:50%;}
.bc{bottom:29.5%;left:27%;width:3.5%;height:5.5%;}
.br2{bottom:29.5%;right:27%;width:3.5%;height:5.5%;}
.li{position:absolute;width:10px;height:10px;border-radius:50%;z-index:20;background:#0a0a0a;}
.li::after{content:attr(data-l);position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:11px;font-family:'Orbitron',sans-serif;white-space:nowrap;color:rgba(255,255,255,0.7);}
.ll{bottom:22%;left:23%;}
.lr{bottom:22%;right:23%;}
.li.gr{background:#0f8;box-shadow:0 0 18px #0f8;}
.li.rd{background:#f00;box-shadow:0 0 18px #f00;animation:bk 1s infinite;}
@keyframes bk{0%,50%{opacity:1}51%,100%{opacity:.15}}

#fbar{position:absolute;bottom:1px;left:0;width:0;height:2px;background:linear-gradient(90deg,#0f8,#0cf);z-index:7;transition:width .3s;}
video, #capCanvas{display:none;}
</style>
</head>
<body>

<div class="intro" id="intro">
  <h1>SELF-OBSERVATORY v1.6</h1>
  <p>系統已校準：齒輪動力對齊 & 面板間距優化</p>
  <button onclick="boot()">開始觀測</button>
</div>

<div class="mw">
  <div id="layerBg"></div>
  <div id="layerGear"></div>
  <div id="layerGearR"></div>

  <div id="infoPanel">
    <div id="infoHeader">SYSTEM_MANIFEST</div>
    <div id="infoBody">
      <span style="color:rgba(255,255,255,.2)">SUBJECT_ID</span><br>
      <span id="iSubjectId">---</span><br><br>
      <span style="color:rgba(255,255,255,.2)">MESH_STATUS</span><br>
      <span style="color:#0f8">468 ACTIVE</span>
    </div>
  </div>

  <div class="sc" id="sc">
    <canvas id="cv"></canvas>
    <div class="crt"></div>
    <div class="vig"></div>
    <div id="fbar"></div>
  </div>

  <div id="layerFg"></div>

  <div class="kc kl"><canvas class="ka" id="kDen"></canvas><div class="kv" id="vDen">×2</div></div>
  <div class="kc kr"><canvas class="ka" id="kDist"></canvas><div class="kv" id="vDist">70%</div></div>

  <div class="ms">
    <div class="mt on" onclick="setMode(1)">REFLEX</div>
    <div class="mt" onclick="setMode(2)">PROCESS</div>
    <div class="mt" onclick="setMode(3)">SYNTH</div>
  </div>

  <div class="btn bc" id="btnC"></div>
  <div class="btn br2" id="btnR"></div>
  <div class="li ll" id="lG" data-l="CAM LINK"></div>
  <div class="li lr" id="lR" data-l="SYS RUN"></div>

  <div id="gazePanel">
    <div id="gazeHeader">BIOMETRIC_ANALYSIS</div>
    <div id="gazeFeed"></div>
  </div>
</div>

<video id="vid" autoplay playsinline></video>
<canvas id="capCanvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>
// 邏輯核心
let S={run:false, cam:false, mode:1, density:2, dist:.7, conf:0, lm:null};
const canvas=document.getElementById('cv'); const ctx=canvas.getContext('2d');
const vid=document.getElementById('vid');
const knobDeg={kDen:90, kDist:252};
const PX={gearRot:0, gearRotR:0};

function drawKnobDial(el,deg){
  const W=el.width=el.offsetWidth, H=el.height=el.offsetHeight;
  const kCtx=el.getContext('2d'); kCtx.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2, r=W*0.4;
  kCtx.strokeStyle='rgba(255,255,255,0.2)'; kCtx.beginPath(); kCtx.arc(cx,cy,r,0,Math.PI*2); kCtx.stroke();
  const angle = (deg-90)*Math.PI/180;
  kCtx.strokeStyle='#fff'; kCtx.lineWidth=3; kCtx.beginPath(); kCtx.moveTo(cx,cy);
  kCtx.lineTo(cx+Math.cos(angle)*r, cy+Math.sin(angle)*r); kCtx.stroke();
}

function setupKnob(id, initDeg){
  const el=document.getElementById(id);
  drawKnobDial(el, initDeg);
}

function updateGears(){
  PX.gearRot += (knobDeg.kDen - PX.gearRot) * 0.1;
  const gL = document.getElementById('layerGear');
  if(gL) gL.style.transform = `translate(-50%, -50%) rotate(${PX.gearRot}deg)`;

  PX.gearRotR += (knobDeg.kDist - PX.gearRotR) * 0.1;
  const gR = document.getElementById('layerGearR');
  if(gR) gR.style.transform = `translate(50%, -50%) rotate(${PX.gearRotR}deg)`;
}

async function boot(){
  document.getElementById('intro').classList.add('off');
  S.run = true; document.getElementById('lR').classList.add('rd');
  try {
    vid.srcObject = await navigator.mediaDevices.getUserMedia({video:true});
    document.getElementById('lG').classList.add('gr');
  } catch(e) {}
}

function loop(){
  updateGears();
  if(S.run) {
    ctx.fillStyle='#111'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.save(); ctx.scale(-1,1); ctx.globalAlpha=0.5;
    ctx.drawImage(vid, -canvas.width, 0, canvas.width, canvas.height);
    ctx.restore();
  }
  requestAnimationFrame(loop);
}

window.onload=()=>{
  canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight;
  setupKnob('kDen', 90); setupKnob('kDist', 252);
  loop();
};
</script>
</body>
</html>
