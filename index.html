<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自我觀測儀 | 完整版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap');
        
        :root {
            --glow-color: #d4a574;     /* 復古琥珀黃 */
            --glow-bright: #e8c891;    /* 亮琥珀黃 */
            --crt-bg: #050805;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: #000;
            color: var(--glow-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 手機直向提示 */
        @media (max-width: 768px) and (orientation: portrait) {
            /* 只在開場頁面隱藏後才顯示旋轉提示 */
            body:not(:has(.intro-screen:not(.hidden)))::before {
                content: "請將手機橫向旋轉 ↻\A以獲得最佳體驗";
                white-space: pre;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0,0,0,0.95);
                color: var(--glow-bright);
                padding: 30px 20px;
                border: 3px solid var(--glow-color);
                border-radius: 15px;
                z-index: 9999;
                font-size: 16px;
                text-align: center;
                max-width: 80%;
                box-shadow: 0 0 30px var(--glow-color);
                animation: pulse 2s infinite;
            }
            
            @keyframes pulse {
                0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.05); }
            }
            
            /* 開場頁面在直向時正常顯示 */
            .intro-screen {
                opacity: 1;
            }
            
            .intro-screen.hidden + * .machine-wrapper {
                opacity: 0.2;
                pointer-events: none;
                filter: blur(3px);
            }
            
            /* 直向模式下縮小背景圖片 */
            .machine-wrapper::before,
            .machine-wrapper::after {
                background-size: 90% auto;
            }
        }
        
        /* 手機橫向優化 */
        @media (max-width: 768px) and (orientation: landscape) {
            .machine-wrapper {
                width: 96vw;
                max-width: none;
                margin: 0 auto;
                /* 確保上下有空間顯示所有元素 */
                transform: scale(0.92);
                transform-origin: center center;
            }
            
            /* 橫向模式下適當調整背景 */
            .machine-wrapper::before,
            .machine-wrapper::after {
                background-size: 96% auto;
            }
            
            .knob-value {
                font-size: clamp(8px, 2vw, 10px);
            }
            
            /* 手機模式下縮小微調按鈕 */
            .fine-tune-panel {
                width: 6%;
                gap: 5%;
            }
            
            .fine-tune-btn {
                width: 12px;
                height: 12px;
                font-size: 8px;
                line-height: 10px;
            }
            
            .fine-tune-label {
                font-size: 6px;
            }
            
            .fine-tune-value {
                font-size: 6px;
            }
            
            /* 確保模式選擇器可見 */
            .mode-selector {
                bottom: 8%;
            }
        }
        
        /* 平板優化 */
        @media (min-width: 769px) and (max-width: 1024px) {
            .machine-wrapper {
                width: 95vw;
            }
            
            .machine-wrapper::before,
            .machine-wrapper::after {
                background-size: contain;
            }
        }

        .machine-wrapper {
            position: relative;
            width: 95vw;
            max-width: 1000px;
            aspect-ratio: 1000 / 667; 
            background-color: #1a1a1a;
            box-shadow: 0 0 100px rgba(212, 165, 116, 0.1);
        }
        
        /* 後方背景層（第一層/最底層）- Image2.png（電子結構，完全不透明） */
        .machine-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('Image2.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 1.0;  /* 完全不透明 */
            z-index: 0;
            pointer-events: none;  /* 不阻擋點擊事件 */
            animation: floatBackground 8s ease-in-out infinite;
        }
        
        /* 前方背景層（第二層/上層）- Image.png（機器面板，完全不透明） */
        .machine-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('Image.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 1.0;  /* 完全不透明 */
            z-index: 1;
            pointer-events: none;  /* 不阻擋點擊事件 */
            animation: floatForeground 6s ease-in-out infinite;
        }
        
        /* 浮動動畫 - 後方背景（左右搖晃，慢速） */
        @keyframes floatBackground {
            0%, 100% {
                transform: translateX(0) scale(1);
            }
            25% {
                transform: translateX(10px) scale(1.005);
            }
            50% {
                transform: translateX(-8px) scale(0.995);
            }
            75% {
                transform: translateX(-10px) scale(1.005);
            }
        }
        
        /* 浮動動畫 - 前方背景（左右搖晃，快速，反向） */
        @keyframes floatForeground {
            0%, 100% {
                transform: translateX(0);
            }
            33% {
                transform: translateX(-6px);
            }
            66% {
                transform: translateX(5px);
            }
        }

        /* 螢幕區域 - 完美對齊 */
        .screen-container {
            position: absolute;
            top: 8.5%;
            left: 25.5%;    /* 往右移（內縮左邊） */
            width: 49%;     /* 縮小寬度（內縮左右） */
            height: 54%;
            background: var(--crt-bg);
            border-radius: 4px;
            overflow: hidden;
            z-index: 2;
        }

        #mainCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* 旋鈕 + 數值顯示 */
        .knob-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .knob-left { 
            top: 8%; left: 6.5%; 
            width: 15%; height: 25%;
        }
        
        .knob-right { 
            top: 8%; right: 6.5%; 
            width: 15%; height: 25%;
        }
        
        /* 左側旋鈕初始角度 */
        #knobDensity {
            --rotation: 60deg;  /* 初始值 0.167 * 360 = 60度 (12個碎片) */
        }
        
        /* 右側旋鈕初始角度 */
        #knobDistort {
            --rotation: 252deg;  /* 初始值 0.7 * 360 = 252度 */
        }

        .knob-area {
            width: 100%;
            height: 85%;
            cursor: ns-resize; 
            background: transparent;
            border-radius: 50%;
            transition: background 0.3s;
            position: relative;
            --rotation: 0deg;  /* CSS 變數控制旋轉角度 */
        }
        
        /* 旋鈕視覺指示線 */
        .knob-area::after {
            content: '';
            position: absolute;
            top: 5%;  /* 從更上方開始 */
            left: 50%;
            width: 4px;  /* 增加寬度 */
            height: 40%;  /* 增加長度 */
            background: linear-gradient(to bottom, var(--glow-bright) 0%, var(--glow-color) 50%, transparent 100%);
            transform-origin: center bottom;  /* 旋轉軸心在底部中心 */
            transform: translateX(-50%) rotate(var(--rotation));  /* 使用 CSS 變數 */
            border-radius: 3px;
            box-shadow: 0 0 12px var(--glow-bright), 0 0 6px var(--glow-color);  /* 強化發光 */
            transition: transform 0.1s ease-out;
        }

        .knob-area:hover {
            background: rgba(212, 165, 116, 0.1);
        }

        .knob-area.active {
            background: rgba(212, 165, 116, 0.2);
            box-shadow: 0 0 15px rgba(212, 165, 116, 0.5);
        }
        
        /* active 狀態時指示線更亮 */
        .knob-area.active::after {
            box-shadow: 0 0 20px var(--glow-bright), 0 0 10px var(--glow-color), 0 0 5px #fff;
            width: 5px;
        }

        .knob-value {
            margin-top: 5%;
            font-size: clamp(9px, 1vw, 11px);
            color: var(--glow-bright);
            text-shadow: 0 0 8px var(--glow-color);
            text-align: center;
            font-weight: bold;
        }

        /* 模式選擇器 */
        .mode-selector {
            position: absolute;
            bottom: 7%; left: 28%;  /* 進一步降低位置到 7% */
            width: 44%; height: 10%;
            z-index: 10;
            display: flex;
            background: transparent;
        }
        
        .mode-target { 
            flex: 1; 
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .mode-target:hover {
            background: rgba(212, 165, 116, 0.05);  /* 減弱 hover 效果 */
        }

        .mode-target.active {
            background: transparent;  /* 取消背景色 */
            box-shadow: none;  /* 取消外框發光 */
        }
        
        /* 模式按鈕發光效果 - 琥珀色 + 亮黃色中間發光 */
        .mode-target.active::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;  /* 縮小發光範圍 */
            height: 60%;
            background: radial-gradient(circle, 
                rgba(232, 200, 145, 0.8) 0%,      /* 亮琥珀黃中心 */
                rgba(212, 165, 116, 0.5) 40%,     /* 琥珀色 */
                rgba(255, 220, 100, 0.2) 60%,     /* 亮黃色邊緣 */
                transparent 80%);
            animation: modePulse 2s ease-in-out infinite;
        }
        
        @keyframes modePulse {
            0%, 100% { 
                opacity: 0.7; 
                transform: translate(-50%, -50%) scale(1);
                filter: brightness(1);
            }
            50% { 
                opacity: 1; 
                transform: translate(-50%, -50%) scale(1.15);
                filter: brightness(1.3);  /* 脈衝時更亮 */
            }
        }
        
        /* 螢幕兩側微調控制面板 */
        .fine-tune-panel {
            position: absolute;
            top: 0;
            height: 100%;
            width: 8%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8%;
            padding: 5% 0;
        }
        
        .fine-tune-left { left: 0; align-items: flex-start; padding-left: 2%; }
        .fine-tune-right { right: 0; align-items: flex-end; padding-right: 2%; }
        
        .fine-tune-control {
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: center;
        }
        
        .fine-tune-label {
            font-size: 7px;
            color: var(--glow-color);
            text-shadow: 0 0 3px var(--glow-color);
            opacity: 0.7;
            text-align: center;
            white-space: nowrap;
        }
        
        .fine-tune-buttons {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .fine-tune-btn {
            width: 16px;
            height: 16px;
            background: rgba(212, 165, 116, 0.1);
            border: 1px solid var(--glow-color);
            color: var(--glow-bright);
            font-size: 10px;
            line-height: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 0 5px rgba(212, 165, 116, 0.3);
        }
        
        .fine-tune-btn:hover {
            background: rgba(212, 165, 116, 0.3);
            box-shadow: 0 0 10px var(--glow-color);
            transform: scale(1.1);
        }
        
        .fine-tune-btn:active {
            background: rgba(212, 165, 116, 0.5);
            transform: scale(0.95);
        }
        
        .fine-tune-value {
            font-size: 8px;
            color: var(--glow-bright);
            text-shadow: 0 0 5px var(--glow-color);
            margin-top: 2px;
            text-align: center;
            min-width: 20px;
        }

        /* 按鈕 + 按下效果 */
        .btn {
            position: absolute;
            cursor: pointer; 
            z-index: 10; 
            background: transparent;
            border-radius: 50%;
            transition: all 0.15s;
        }

        .btn-cam { 
            bottom: 29.5%; left: 19.8%; 
            width: 3.5%; height: 5.5%;
        }
        
        .btn-run { 
            bottom: 29.5%; right: 19.8%; 
            width: 3.5%; height: 5.5%;
        }

        .btn:hover {
            background: rgba(212, 165, 116, 0.15);
        }

        .btn:active {
            transform: scale(0.95);
            background: rgba(212, 165, 116, 0.3);
        }

        /* 指示燈 */
        .light {
            position: absolute;
            width: 8px; height: 8px;
            border-radius: 50%;
            transition: all 0.3s;
            background: #200;
            z-index: 10;
        }
        .light-left { bottom: 22%; left: 15%; }      /* 綠燈：對應左下 CAM 按鈕 */
        .light-right { bottom: 22%; right: 15%; }    /* 紅燈：對應右下 RUN 按鈕 */
        .light.active-red { 
            background: #f00; 
            box-shadow: 0 0 12px #f00, 0 0 20px #f00;
            animation: blink 1s infinite;
        }
        .light.active-green { 
            background: #0f8; 
            box-shadow: 0 0 12px #0f8;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        /* 螢幕內文字 */
        .ui-text {
            position: absolute;
            padding: 12px;
            font-size: 10px;
            pointer-events: none;
            z-index: 4;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--glow-color);
        }
        .ui-top-left { top: 0; left: 0; }
        .ui-bottom-right { bottom: 0; right: 0; text-align: right; opacity: 0.8; }
        
        /* 階段1 五官偵測標記 */
        .facial-marker {
            position: absolute;
            border: 2px solid var(--glow-bright);
            pointer-events: none;
            z-index: 4;
            box-shadow: 0 0 10px var(--glow-color);
            transition: all 0.3s;
        }
        
        .facial-marker::before {
            content: attr(data-label);
            position: absolute;
            top: -18px;
            left: 0;
            font-size: 8px;
            color: var(--glow-bright);
            text-shadow: 0 0 5px var(--glow-color);
            white-space: nowrap;
        }
        
        /* 手部偵測框 */
        .hand-marker {
            position: absolute;
            border: 2px dashed rgba(100, 255, 100, 0.8);
            pointer-events: none;
            z-index: 4;
            box-shadow: 0 0 15px rgba(100, 255, 100, 0.5);
            animation: handPulse 1.5s ease-in-out infinite;
        }
        
        .hand-marker::before {
            content: attr(data-label);
            position: absolute;
            top: -18px;
            left: 0;
            font-size: 9px;
            color: rgba(100, 255, 100, 1);
            text-shadow: 0 0 8px rgba(100, 255, 100, 0.8);
            font-weight: bold;
        }
        
        @keyframes handPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        #videoElement { display: none; }
        
        /* 開場說明頁面 */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #000 0%, #1a1a1a 50%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 40px;
            box-sizing: border-box;
            opacity: 1;
            transition: opacity 0.5s;
        }
        
        .intro-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .intro-title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(28px, 5vw, 48px);
            color: var(--glow-bright);
            text-shadow: 0 0 20px var(--glow-color), 0 0 40px var(--glow-color);
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 3px;
            animation: titleGlow 3s ease-in-out infinite;
        }
        
        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 20px var(--glow-color), 0 0 40px var(--glow-color); }
            50% { text-shadow: 0 0 30px var(--glow-bright), 0 0 60px var(--glow-bright); }
        }
        
        .intro-content {
            max-width: 900px;
            background: transparent;  /* 移除背景 */
            border: none;  /* 移除邊框 */
            border-radius: 0;
            padding: 20px;  /* 減少內邊距 */
            box-shadow: none;  /* 移除陰影 */
            margin-bottom: 30px;  /* 減少間距 */
            max-height: 75vh;  /* 增加可視高度 */
            overflow-y: auto;
        }
        
        /* 圖形化控制說明 */
        .control-diagram {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 1000 / 667;
            margin: 20px auto;
            background: rgba(26, 26, 26, 0.5);
            background-image: url('Image.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border: 1px solid rgba(212, 165, 116, 0.3);
            border-radius: 8px;
        }
        
        /* 標記點 */
        .marker {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        
        .marker-dot {
            width: 12px;
            height: 12px;
            background: var(--glow-bright);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--glow-bright), 0 0 25px var(--glow-color);
            position: relative;
            animation: dotPulse 2s ease-in-out infinite;
        }
        
        @keyframes dotPulse {
            0%, 100% { 
                transform: scale(1); 
                box-shadow: 0 0 15px var(--glow-bright), 0 0 25px var(--glow-color);
            }
            50% { 
                transform: scale(1.3); 
                box-shadow: 0 0 25px var(--glow-bright), 0 0 40px var(--glow-color);
            }
        }
        
        .marker-dot::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            animation: innerPulse 2s ease-in-out infinite;
        }
        
        @keyframes innerPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        
        .marker-label {
            background: rgba(0, 0, 0, 0.9);
            color: var(--glow-bright);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: clamp(10px, 1.5vw, 13px);
            border: 1px solid var(--glow-color);
            box-shadow: 0 0 10px rgba(212, 165, 116, 0.5);
            white-space: nowrap;
            font-weight: bold;
            animation: labelFloat 3s ease-in-out infinite;
        }
        
        @keyframes labelFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        
        /* 標記位置 */
        .marker-knob-left {
            top: 15%;
            left: 5%;
        }
        
        .marker-knob-right {
            top: 15%;
            right: 5%;
        }
        
        .marker-mode {
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .marker-cam {
            bottom: 28%;
            left: 15%;
        }
        
        .marker-run {
            bottom: 28%;
            right: 15%;
        }
        
        .marker-screen {
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .marker-fine-tune {
            top: 35%;
            left: 28%;
        }
        
        /* 模式說明區 */
        .mode-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;  /* 減少間距 */
            margin-top: 15px;  /* 減少上邊距 */
        }
        
        .mode-card {
            background: transparent;  /* 移除背景 */
            border: none;  /* 移除邊框 */
            border-radius: 0;
            padding: 10px 5px;  /* 減少內邊距 */
            transition: all 0.3s;
        }
        
        .mode-card:hover {
            background: rgba(212, 165, 116, 0.1);
            box-shadow: none;
        }
        
        .mode-card h4 {
            color: var(--glow-bright);
            font-size: clamp(13px, 2vw, 15px);  /* 縮小字體 */
            margin-bottom: 5px;  /* 減少間距 */
            text-shadow: 0 0 5px var(--glow-color);
        }
        
        .mode-card p {
            color: rgba(212, 165, 116, 0.85);
            font-size: clamp(11px, 1.5vw, 13px);  /* 縮小字體 */
            line-height: 1.4;  /* 減少行高 */
            margin: 0;
        }
        
        /* 互動提示 */
        .interaction-tip {
            background: transparent;  /* 移除背景 */
            border: none;  /* 移除邊框 */
            border-radius: 0;
            padding: 10px 5px;  /* 減少內邊距 */
            margin-top: 15px;  /* 減少上邊距 */
        }
        
        .interaction-tip h4 {
            color: rgba(100, 255, 100, 1);
            font-size: clamp(13px, 2vw, 15px);  /* 縮小字體 */
            margin-bottom: 8px;  /* 減少間距 */
            text-shadow: 0 0 5px rgba(100, 255, 100, 0.5);
        }
        
        .interaction-tip ul {
            list-style: none;
            padding: 0;

        .interaction-tip li {
            color: rgba(100, 255, 100, 0.85);

            line-height: 1.4;  /* 減少行高 */
        }
        
        .interaction-tip li::before {
            content: '▸';

        /* 自定義滾動條 */
        .intro-content::-webkit-scrollbar {

        }
        
        .intro-content::-webkit-scrollbar-track {

        /* 手機版優化 */
        @media (max-width: 768px) {
            .intro-screen {
                padding: 15px;  /* 減少內邊距 */

            .intro-content {
                padding: 10px;  /* 減少內邊距 */

            .intro-title {
                margin-bottom: 15px;  /* 減少間距 */

            /* 手機版控制圖示 */

            /* 手機版調整標記位置 */

                top: 12%;

        /* 平板版優化 */

        .intro-section ul {

        .start-button {
            font-family: 'Orbitron', monospace;
            font-size: clamp(18px, 3vw, 24px);
            padding: 18px 50px;
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.2), rgba(232, 200, 145, 0.3));
            border: 3px solid var(--glow-bright);

        /* 退出按鈕 */

            z-index: 9999;

    </style>
</head>
<body>

    <!-- 開場說明頁面 -->
    <div class="intro-screen" id="introScreen">
        <h1 class="intro-title">Self-Observation Device</h1>
        
        <div class="intro-content">
            <!-- 圖形化控制說明 -->

                <!-- 左側旋鈕標記 -->

                </div>
                
                <!-- 右側旋鈕標記 -->
                <div class="marker marker-knob-right">
                    <div class="marker-label">變形</div>
                    <div class="marker-dot"></div>
                </div>
                
                <!-- 螢幕標記 -->
                <div class="marker marker-screen">
                    <div class="marker-label">觀測螢幕</div>
                </div>
                
                <!-- 微調按鈕標記 -->
                <div class="marker marker-fine-tune">
                    <div class="marker-dot"></div>
                    <div class="marker-label">微調 +/-</div>
                </div>
                
                <!-- CAM 按鈕標記 -->
                <div class="marker marker-cam">
                    <div class="marker-dot"></div>
                    <div class="marker-label">CAM 🟢</div>
                </div>
                
                <!-- RUN 按鈕標記 -->
                <div class="marker marker-run">

                <!-- MODE 標記 -->

                </div>
            </div>
            
            <!-- 三種觀測模式說明 -->
            <div class="mode-info">
                <div class="mode-card">
                    <h4>階段 1｜鏡像期</h4>
                    <p>臉部掃描與特徵點追蹤</p>
                </div>
                
                <div class="mode-card">
                    <h4>階段 2｜資料規訓</h4>
                    <p>色彩解構與像素化處理</p>
                </div>
                
                <div class="mode-card">
