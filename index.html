<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自我觀測儀 | SELF-OBSERVATORY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap');
:root{--dim:rgba(255,255,255,0.38);--crt:#020202;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Share Tech Mono',monospace;background:#000;color:#fff;height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center;}

/* ── INTRO ── */
.intro{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;padding:24px;transition:opacity .8s;}
.intro.off{opacity:0;pointer-events:none;}
.intro h1{font-family:'Orbitron',sans-serif;font-size:clamp(20px,4.5vw,40px);letter-spacing:8px;text-shadow:0 0 28px #fff,0 0 55px rgba(255,255,255,.25);margin-bottom:22px;}
.intro p{color:var(--dim);font-size:13px;line-height:1.9;text-align:center;max-width:540px;margin-bottom:8px;letter-spacing:.5px;}
.intro button{margin-top:32px;font-family:'Orbitron',sans-serif;padding:13px 46px;background:transparent;border:1px solid rgba(255,255,255,.75);color:#fff;font-size:14px;cursor:pointer;letter-spacing:4px;box-shadow:0 0 18px rgba(255,255,255,.12);transition:all .3s;}
.intro button:hover{background:rgba(255,255,255,.06);box-shadow:0 0 36px rgba(255,255,255,.35);}

/* ── MACHINE ── */
.mw{position:relative;width:95vw;max-width:1000px;aspect-ratio:1000/667;background:#090909;}
.mw::before{content:'';position:absolute;inset:0;background:url('Image2.png') center/contain no-repeat;z-index:0;pointer-events:none;animation:bg 15s ease-in-out infinite;}
.mw::after{content:'';position:absolute;inset:0;background:url('Image.png') center/contain no-repeat;z-index:1;pointer-events:none;animation:fg 10s ease-in-out infinite;}
@keyframes bg{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,3px)}}
@keyframes fg{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-2px)}}

/* ── SCREEN ── */
.sc{position:absolute;top:8.5%;left:25.5%;width:49%;height:54%;background:var(--crt);border-radius:4px;overflow:hidden;z-index:2;border:1px solid rgba(255,255,255,.22);box-shadow:0 0 18px rgba(255,255,255,.07),inset 0 0 28px rgba(0,0,0,.8);}
#cv{width:100%;height:100%;display:block;}
.crt{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,.18) 50%),linear-gradient(90deg,rgba(255,255,255,.015),rgba(255,255,255,.008),rgba(255,255,255,.015));background-size:100% 3px,3px 100%;pointer-events:none;z-index:5;}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.78) 100%);pointer-events:none;z-index:6;}

/* ── UI TEXT ── */
.uit{position:absolute;padding:7px 9px;font-size:9px;pointer-events:none;z-index:4;text-transform:uppercase;color:rgba(255,255,255,.82);text-shadow:0 0 7px rgba(255,255,255,.45);line-height:1.75;letter-spacing:.8px;}
.tl{top:0;left:0;}
.tl div:first-child{color:#fff;font-size:10px;font-weight:bold;text-shadow:0 0 11px #fff;}
.br{bottom:0;right:0;text-align:right;color:rgba(255,255,255,.38);font-size:8px;}

/* ── KNOBS ── */
.kc{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:10;}
.kl{top:8%;left:6.5%;width:15%;height:25%;}
.kr{top:8%;right:6.5%;width:15%;height:25%;}
.ka{width:100%;height:85%;cursor:ns-resize;position:relative;--rot:0deg;}
.ka::after{content:'';position:absolute;top:5%;left:50%;width:2px;height:40%;background:linear-gradient(to bottom,#fff,rgba(255,255,255,.28),transparent);transform-origin:center bottom;transform:translateX(-50%) rotate(var(--rot));border-radius:2px;box-shadow:0 0 11px #fff,0 0 22px rgba(255,255,255,.35);}
.kv{font-size:9px;color:rgba(255,255,255,.68);text-shadow:0 0 7px #fff;margin-top:4px;font-weight:bold;letter-spacing:1px;}

/* ── MODES ── */
.ms{position:absolute;bottom:4.5%;left:26%;width:48%;height:11%;z-index:10;display:flex;justify-content:space-around;align-items:center;}
.mt{flex:1;height:100%;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--dim);font-size:13px;font-weight:bold;font-family:'Orbitron',sans-serif;letter-spacing:2px;transition:all .4s;}
.mt::before{content:'';width:5px;height:5px;background:#1a1a1a;border:1px solid rgba(255,255,255,.1);border-radius:50%;margin-bottom:5px;transition:all .3s;}
.mt.on{color:#fff;text-shadow:0 0 11px #fff,0 0 24px rgba(255,255,255,.45),0 0 48px rgba(255,255,255,.18);}
.mt.on::before{background:#fff;box-shadow:0 0 11px #fff,0 0 24px #fff,0 0 48px rgba(255,255,255,.45);border-color:#fff;}

/* ── BUTTONS & LIGHTS ── */
.btn{position:absolute;cursor:pointer;z-index:10;border-radius:50%;}
.bc{bottom:29.5%;left:19.8%;width:3.5%;height:5.5%;}
.br2{bottom:29.5%;right:19.8%;width:3.5%;height:5.5%;}
.li{position:absolute;width:10px;height:10px;border-radius:50%;z-index:10;background:#0a0a0a;}
.li::after{content:attr(data-l);position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:7px;color:rgba(255,255,255,.22);white-space:nowrap;letter-spacing:1px;}
.ll{bottom:22%;left:15%;}
.lr{bottom:22%;right:15%;}
.li.gr{background:#0f8;box-shadow:0 0 18px #0f8,0 0 36px rgba(0,255,136,.35);}
.li.rd{background:#f00;box-shadow:0 0 18px #f00,0 0 36px rgba(255,0,0,.35);animation:bk 1s infinite;}
@keyframes bk{0%,50%{opacity:1}51%,100%{opacity:.15}}

/* ── FACE STATUS BAR ── */
#fbar{position:absolute;bottom:1px;left:0;width:0;height:2px;background:linear-gradient(90deg,#0f8,#0cf);z-index:7;transition:width .3s;border-radius:0 2px 2px 0;}

video{display:none;}
</style>
</head>
<body>

<!-- INTRO -->
<div class="intro" id="intro">
  <h1>SELF-OBSERVATORY</h1>
  <p>這是一台解析主體擬像的數位觀測儀器。<br>
     系統使用 <strong style="color:#0f8">MediaPipe FaceMesh</strong> 追蹤 468 個面部標記點，<br>
     將你的五官精準替換為陌生人的容貌碎片。</p>
  <p style="font-size:11px;margin-top:4px;">旋鈕一：碎片密度 &nbsp;|&nbsp; 旋鈕二：異化強度</p>
  <button onclick="boot()">開始體驗 / START</button>
</div>

<!-- MACHINE -->
<div class="mw">
  <div class="sc" id="sc">
    <div class="uit tl">
      <div id="dmode">MODE: MIRROR_STAGE</div>
      <div id="dstat">SYS: STANDBY</div>
    </div>
    <div class="uit br" id="log">AWAITING FACE DATA...</div>
    <canvas id="cv"></canvas>
    <div class="crt"></div>
    <div class="vig"></div>
    <div id="fbar"></div>
  </div>

  <!-- Knobs -->
  <div class="kc kl"><div class="ka" id="kDen"></div><div class="kv" id="vDen">×2</div></div>
  <div class="kc kr"><div class="ka" id="kDist"></div><div class="kv" id="vDist">70%</div></div>

  <!-- Mode selector -->
  <div class="ms">
    <div class="mt on" onclick="setMode(1)">REFLEX</div>
    <div class="mt" onclick="setMode(2)">PROCESS</div>
    <div class="mt" onclick="setMode(3)">SYNTH</div>
  </div>

  <!-- Buttons + lights -->
  <div class="btn bc" id="btnC"></div>
  <div class="btn br2" id="btnR"></div>
  <div class="li ll" id="lG" data-l="CAM LINK"></div>
  <div class="li lr" id="lR" data-l="SYS RUN"></div>
</div>

<video id="vid" autoplay playsinline></video>

<!-- MediaPipe FaceMesh CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

<script>
// ════════════════════════════════════════════════
//  SOUND
// ════════════════════════════════════════════════
const SFX={
  click:new Audio('sounds/click.mp3'),
  knob: new Audio('sounds/knob.mp3'),
  mode: new Audio('sounds/mode.mp3'),
};
Object.values(SFX).forEach(a=>{a.volume=.55;a.preload='auto';});
function sfx(n){try{SFX[n].currentTime=0;SFX[n].play().catch(()=>{});}catch(e){}}
let knbT=null;
function sfxKnob(){clearTimeout(knbT);knbT=setTimeout(()=>sfx('knob'),80);}

// ════════════════════════════════════════════════
//  CANVAS
// ════════════════════════════════════════════════
const canvas=document.getElementById('cv');
const ctx=canvas.getContext('2d');
const vid=document.getElementById('vid');

// ════════════════════════════════════════════════
//  IMAGE LIBRARY  facial-parts/
// ════════════════════════════════════════════════
const TYPES=['eyes','mouth','nose','ears'];
const PCOUNT=50;
const imgs={};
let imgLoaded=0,imgTotal=TYPES.length*PCOUNT;
TYPES.forEach(t=>{
  imgs[t]=[];
  for(let i=1;i<=PCOUNT;i++){
    const im=new Image();
    im.src=`facial-parts/${t}/${t}_${String(i).padStart(2,'0')}.png`;
    im.onload=im.onerror=()=>{imgLoaded++;if(imgLoaded===imgTotal)log("IMG DB READY.");};
    imgs[t].push(im);
  }
});

// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════
const S={
  run:false, cam:false, mode:1,
  density:2,   // 1~5 (層數)
  dist:.7,
  frame:0, scanY:0,
  // FaceMesh 結果
  lm:null,           // landmarks array (468 points, each {x,y,z})
  conf:0,            // 0~1 信心值（有臉=1，沒有逐漸衰減）
  // Stage3 碎片物理
  frags:[], fragDirty:true,
  // 旋鈕
  density_raw:.25,
  dist_raw:.7,
};

// ════════════════════════════════════════════════
//  MEDIAPIPE FACE MESH
// ════════════════════════════════════════════════
let faceMesh=null;
let mpCamera=null;

// 重要 landmark 索引（MediaPipe 468點的子集）
const LM={
  // 眼睛
  leftEyeOuter:33, leftEyeInner:133, leftEyeTop:159, leftEyeBot:145,
  rightEyeOuter:362, rightEyeInner:263, rightEyeTop:386, rightEyeBot:374,
  // 眉毛
  leftBrowOuter:70, leftBrowInner:107,
  rightBrowOuter:300, rightBrowInner:336,
  // 鼻子
  noseTip:4, noseBot:2, noseBridgeTop:6,
  noseLeft:49, noseRight:279,
  // 嘴巴
  mouthLeft:61, mouthRight:291,
  mouthTop:13, mouthBot:14,
  upperLip:0, lowerLip:17,
  // 臉輪廓
  chinBot:152, foreheadTop:10,
  leftCheek:234, rightCheek:454,
  leftJaw:172, rightJaw:397,
  // 耳朵（用臉輪廓最外側推算）
  leftEar:127, rightEar:356,
};

// 取得某個 landmark 的畫布座標
function lp(idx){
  if(!S.lm||!S.lm[idx]) return null;
  const p=S.lm[idx];
  // lm 座標是 0~1 歸一化（但攝影機是鏡像，x 需翻轉）
  return {
    x:(1-p.x)*canvas.width,
    y:p.y*canvas.height
  };
}

// 兩點中間點
function mid(a,b){if(!a||!b)return null;return{x:(a.x+b.x)/2,y:(a.y+b.y)/2};}

// 兩點距離
function dist2(a,b){if(!a||!b)return 0;return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);}

function initFaceMesh(){
  faceMesh=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
  faceMesh.setOptions({
    maxNumFaces:1,
    refineLandmarks:true,
    minDetectionConfidence:.5,
    minTrackingConfidence:.5,
  });
  faceMesh.onResults(onFaceResults);
  log("FACE MESH INIT...");
}

function onFaceResults(results){
  if(results.multiFaceLandmarks&&results.multiFaceLandmarks.length>0){
    S.lm=results.multiFaceLandmarks[0];
    S.conf=Math.min(1,S.conf+.15);
  } else {
    S.lm=null;
    S.conf=Math.max(0,S.conf-.04);
  }
  // 更新信心條
  const bar=document.getElementById('fbar');
  if(bar)bar.style.width=(S.conf*100)+'%';
}

async function startFaceMesh(){
  if(!vid.srcObject)return;
  if(!faceMesh)initFaceMesh();
  if(mpCamera)mpCamera.stop();
  mpCamera=new Camera(vid,{
    onFrame:async()=>{
      if(faceMesh&&S.run)await faceMesh.send({image:vid});
    },
    width:640, height:480
  });
  mpCamera.start();
  log("FACE MESH ACTIVE.");
}

// ════════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════════
async function boot(){
  sfx('click');
  document.getElementById('intro').classList.add('off');
  log("INITIALIZING...");
  await toggleCam();
  if(!S.run)toggleRun();
}

function init(){
  resize();
  setupEvents();
  requestAnimationFrame(loop);
  log("FACE ENGINE v6 (FaceMesh)");
}

function setupEvents(){
  document.getElementById('btnC').addEventListener('click',()=>{sfx('click');toggleCam();});
  document.getElementById('btnR').addEventListener('click',()=>{sfx('click');toggleRun();});
  setupKnob('kDen',v=>{
    S.density_raw=v;
    S.density=Math.max(1,Math.round(1+v*4)); // 1~5
    document.getElementById('vDen').textContent='×'+S.density;
    S.fragDirty=true;
    sfxKnob();
  },.25);
  setupKnob('kDist',v=>{
    S.dist_raw=v;
    S.dist=v;
    document.getElementById('vDist').textContent=~~(v*100)+'%';
    sfxKnob();
  },.7);
  window.addEventListener('resize',resize);
}

function setupKnob(id,cb,init){
  let drag=false,ly=0,cur=init;
  const el=document.getElementById(id);
  el.style.setProperty('--rot',`${cur*360}deg`);
  cb(cur);
  const s=y=>{drag=true;ly=y;};
  const m=y=>{if(!drag)return;cur=Math.min(1,Math.max(0,cur+(ly-y)*.005));ly=y;cb(cur);el.style.setProperty('--rot',`${cur*360}deg`);};
  const e=()=>drag=false;
  el.onmousedown=ev=>{ev.preventDefault();s(ev.clientY);};
  el.ontouchstart=ev=>{ev.preventDefault();s(ev.touches[0].clientY);};
  window.addEventListener('mousemove',ev=>m(ev.clientY));
  window.addEventListener('touchmove',ev=>m(ev.touches[0].clientY),{passive:false});
  window.addEventListener('mouseup',e);window.addEventListener('touchend',e);
}

async function toggleCam(){
  if(!S.cam){
    try{
      vid.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
      S.cam=true;
      document.getElementById('lG').classList.add('gr');
      log("CAM LINK: ON");
    }catch(e){log("ERR: CAM DENIED");}
  }else{
    if(vid.srcObject)vid.srcObject.getTracks().forEach(t=>t.stop());
    if(mpCamera)mpCamera.stop();
    S.cam=false;S.lm=null;S.conf=0;
    document.getElementById('lG').classList.remove('gr');
    log("CAM LINK: OFF");
  }
}

function toggleRun(){
  S.run=!S.run;
  document.getElementById('lR').classList.toggle('rd',S.run);
  document.getElementById('dstat').textContent='SYS: '+(S.run?'OBSERVING':'STANDBY');
  if(S.run){
    S.fragDirty=true;
    startFaceMesh();
  }else{
    if(mpCamera)mpCamera.stop();
  }
  log(S.run?"PROC_START":"PROC_HALT");
}

function setMode(m){
  S.mode=m;sfx('mode');
  const nm=['','MIRROR_STAGE','DATA_DISCIPLINE','FACE_REWRITE'];
  document.getElementById('dmode').textContent='MODE: '+nm[m];
  document.querySelectorAll('.mt').forEach((el,i)=>el.classList.toggle('on',i===m-1));
  log('STAGE_'+m+' ACTIVATED.');
}

// ════════════════════════════════════════════════
//  MAIN LOOP
// ════════════════════════════════════════════════
function loop(){
  S.frame++;
  if(S.run&&S.cam){
    if(S.mode===3&&S.fragDirty)buildFrags();
    render();
  }
  requestAnimationFrame(loop);
}

// ════════════════════════════════════════════════
//  RENDER dispatcher
// ════════════════════════════════════════════════
// 全螢幕後處理 canvas
const ppCvs=document.createElement('canvas');
const ppCtx=ppCvs.getContext('2d');

function render(){
  const W=canvas.width,H=canvas.height;
  if(ppCvs.width!==W||ppCvs.height!==H){ppCvs.width=W;ppCvs.height=H;}
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  if(S.mode===1)stage1(W,H);
  else if(S.mode===2)stage2(W,H);
  else stage3(W,H);

  // 右旋鈕後處理
  postFX(W,H);
}

// ════════════════════════════════════════════════
//  POST-FX  (右旋鈕控制)
// ════════════════════════════════════════════════
function postFX(W,H){
  const d=S.dist,t=S.frame*.016;
  if(d<.05)return;
  // 色差
  const ca=Math.floor(d*d*16);
  if(ca>=1){
    ppCtx.clearRect(0,0,W,H);ppCtx.drawImage(canvas,0,0);
    ctx.save();ctx.globalCompositeOperation='screen';
    ctx.globalAlpha=.22*d;ctx.drawImage(ppCvs,-ca,0);
    ctx.globalAlpha=.18*d;ctx.drawImage(ppCvs, ca,0);
    ctx.restore();
  }
  // 掃描干擾線
  if(d>.28&&Math.random()>.72){
    ctx.save();ctx.globalAlpha=.1*d;
    const lc=Math.floor(d*d*7);
    for(let i=0;i<lc;i++){
      const ly=~~(Math.random()*H);
      ctx.drawImage(canvas,(Math.random()-.5)*d*24,ly,W,3,(Math.random()-.5)*d*24,ly,W,3);
      ctx.fillStyle=`rgba(255,255,255,${.04+Math.random()*.08})`;
      ctx.fillRect(0,ly,W,2);
    }
    ctx.restore();
  }
  // 波浪扭曲
  if(d>.50){
    ppCtx.clearRect(0,0,W,H);ppCtx.drawImage(canvas,0,0);
    ctx.save();ctx.globalAlpha=.9;
    const amp=d*d*10,strip=4;
    for(let y=0;y<H;y+=strip){
      const ox=Math.sin(y*.038+t*2.8)*amp*(d-.5)*2.2;
      ctx.drawImage(ppCvs,0,y,W,strip,ox,y,W,strip);
    }
    ctx.restore();
  }
  // 紅色暈染
  if(d>.78&&Math.random()>.9){
    ctx.save();ctx.globalAlpha=(d-.78)*4*.1;
    const vg=ctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.7);
    vg.addColorStop(0,'rgba(255,0,0,0)');vg.addColorStop(1,'rgba(255,0,40,.45)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);ctx.restore();
  }
}

// ════════════════════════════════════════════════
//  STAGE 1 — MIRROR STAGE  (MediaPipe Landmarks)
// ════════════════════════════════════════════════
function stage1(W,H){
  const t=S.frame*.016;

  // 影片底層（鏡像）
  ctx.save();ctx.globalAlpha=.52;ctx.scale(-1,1);ctx.drawImage(vid,-W,0,W,H);ctx.restore();

  // 掃描線
  S.scanY=(S.scanY+3)%H;
  const tr=ctx.createLinearGradient(0,S.scanY-65,0,S.scanY);
  tr.addColorStop(0,'rgba(255,255,255,0)');tr.addColorStop(1,'rgba(255,255,255,.07)');
  ctx.fillStyle=tr;ctx.fillRect(0,S.scanY-65,W,65);
  ctx.save();ctx.shadowBlur=16;ctx.shadowColor='#fff';ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(0,S.scanY);ctx.lineTo(W,S.scanY);ctx.stroke();ctx.restore();

  // 信心文字
  const c=S.conf;
  const statusColor=c>.65?'#0f8':c>.25?'#ff0':'#f55';
  ctx.save();ctx.fillStyle=statusColor;ctx.font='8px Share Tech Mono';ctx.shadowBlur=8;ctx.shadowColor=statusColor;
  ctx.fillText(`FACE ${c>.65?'LOCKED':c>.25?'ACQUIRING':'SEARCHING'} ${~~(c*100)}%`,7,H-6);ctx.restore();

  if(!S.lm||c<.15)return;

  const pulse=c>.65?1+Math.sin(t*2.4)*.055:1;

  // ── 臉部外框 ──
  const contourIdx=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
  const cpts=contourIdx.map(i=>lp(i)).filter(Boolean);
  if(cpts.length>4){
    ctx.save();ctx.globalAlpha=.35+c*.5;
    ctx.strokeStyle=c>.65?'rgba(0,255,136,.9)':'rgba(255,255,80,.8)';
    ctx.shadowBlur=c>.65?20:12;ctx.shadowColor=c>.65?'#0f8':'#ff0';ctx.lineWidth=1;
    ctx.beginPath();cpts.forEach((p,i)=>{
      const px=W/2+(p.x-W/2)*pulse,py=H/2+(p.y-H/2)*pulse;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    });ctx.closePath();ctx.stroke();ctx.restore();
  }

  // ── 彩色五官特徵點 ──
  // 左眼（青色）
  const leftEyeIdxs=[33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246];
  drawLandmarkContour(leftEyeIdxs,'rgba(0,238,255,.9)',true,pulse,W,H);
  // 右眼（青色）
  const rightEyeIdxs=[263,249,390,373,374,380,381,382,362,398,384,385,386,387,388,466];
  drawLandmarkContour(rightEyeIdxs,'rgba(0,238,255,.9)',true,pulse,W,H);
  // 嘴巴（金黃）
  const mouthOuterIdx=[61,185,40,39,37,0,267,269,270,409,291,375,321,405,314,17,84,181,91,146];
  drawLandmarkContour(mouthOuterIdx,'rgba(255,204,0,.9)',true,pulse,W,H);
  // 鼻子（粉紫）
  const noseIdx=[168,6,197,195,5,4,1,19,94,2,98,97,2,326,327];
  drawLandmarkContour(noseIdx,'rgba(255,68,204,.85)',false,pulse,W,H);
  // 左眉（白）
  const lBrowIdx=[70,63,105,66,107,55,65,52,53,46];
  drawLandmarkContour(lBrowIdx,'rgba(255,255,255,.7)',false,pulse,W,H);
  // 右眉（白）
  const rBrowIdx=[300,293,334,296,336,285,295,282,283,276];
  drawLandmarkContour(rBrowIdx,'rgba(255,255,255,.7)',false,pulse,W,H);

  // 鎖定時：加強中心準線
  if(c>.65){
    const nose=lp(LM.noseTip);
    if(nose){
      ctx.save();ctx.strokeStyle='rgba(0,255,136,.7)';ctx.lineWidth=.9;ctx.shadowBlur=9;ctx.shadowColor='#0f8';
      ctx.setLineDash([4,8]);
      ctx.beginPath();ctx.moveTo(nose.x-14,nose.y);ctx.lineTo(nose.x+14,nose.y);
      ctx.moveTo(nose.x,nose.y-14);ctx.lineTo(nose.x,nose.y+14);ctx.stroke();
      ctx.setLineDash([]);ctx.restore();
    }
  }
}

function drawLandmarkContour(indices,color,closed,pulse,W,H){
  const pts=indices.map(i=>lp(i)).filter(Boolean);
  if(pts.length<2)return;
  ctx.save();
  ctx.strokeStyle=color;ctx.lineWidth=1;ctx.shadowBlur=9;ctx.shadowColor=color;
  ctx.beginPath();
  pts.forEach((p,i)=>{
    const px=W/2+(p.x-W/2)*pulse,py=H/2+(p.y-H/2)*pulse;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  });
  if(closed)ctx.closePath();
  ctx.stroke();
  // 特徵點點
  pts.forEach((p,i)=>{
    if(i%3!==0)return;
    const px=W/2+(p.x-W/2)*pulse,py=H/2+(p.y-H/2)*pulse;
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(px,py,1.4,0,Math.PI*2);ctx.fill();
  });
  ctx.restore();
}

// ════════════════════════════════════════════════
//  STAGE 2 — DATA DISCIPLINE
//  直接用 MediaPipe lm 分辨人物/背景，格子著色
// ════════════════════════════════════════════════
// 採樣 canvas
const s2c=document.createElement('canvas');s2c.width=80;s2c.height=60;
const s2x=s2c.getContext('2d');

function stage2(W,H){
  s2x.drawImage(vid,0,0,80,60);
  const pd=s2x.getImageData(0,0,80,60).data;

  ctx.save();ctx.globalAlpha=.2;ctx.scale(-1,1);ctx.drawImage(vid,-W,0,W,H);ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.74)';ctx.fillRect(0,0,W,H);

  const GS=20;

  // 如果有 FaceMesh，計算臉部多邊形用於前景判斷
  let faceConvex=null;
  if(S.lm&&S.conf>.3){
    const outerIdxs=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
    faceConvex=outerIdxs.map(i=>{
      const p=S.lm[i];
      if(!p)return null;
      return{x:(1-p.x)*W,y:p.y*H};
    }).filter(Boolean);
  }

  // 身體橢圓中心（從臉部下延）
  let bodyCx=W/2,bodyCy=H/2,bodyRx=W*.15,bodyRy=H*.38;
  if(S.lm&&S.conf>.3){
    const chin=lp(LM.chinBot);
    const topH=lp(LM.foreheadTop);
    const lc=lp(LM.leftCheek);
    const rc=lp(LM.rightCheek);
    if(chin&&topH&&lc&&rc){
      const faceH=dist2(topH,chin);
      const faceW=dist2(lc,rc);
      bodyCx=(lc.x+rc.x)/2;
      bodyCy=chin.y+faceH*.6;
      bodyRx=faceW*.65;
      bodyRy=faceH*1.4;
    }
  }

  for(let gx=0;gx<W;gx+=GS){
    for(let gy=0;gy<H;gy+=GS){
      const cx=gx+GS/2,cy=gy+GS/2;

      // 採樣畫素（鏡像翻轉x）
      const sx=Math.floor((1-cx/W)*80),sy=Math.floor(cy/H*60);
      const si=(Math.min(79,Math.max(0,sx))+Math.min(59,Math.max(0,sy))*80)*4;
      const r=pd[si],g=pd[si+1],b=pd[si+2];
      const Y=.299*r+.587*g+.114*b;
      const Cb=-.169*r-.331*g+.5*b+128;
      const Cr=.5*r-.419*g-.081*b+128;
      const skin=Y>32&&Cb>=74&&Cb<=150&&Cr>=124&&Cr<=192;

      // 是否在臉部多邊形內
      const inFace=faceConvex?pointInPoly(cx,cy,faceConvex):false;

      // 是否在身體橢圓內
      const bex=(cx-bodyCx)/bodyRx,bey=(cy-bodyCy)/bodyRy;
      const inBody=bex*bex+bey*bey<1;

      let hue,sat,lum,al,lw;
      if(inFace||skin&&S.conf>.4){
        // 臉部：暖橙黃
        const dep=inFace?(1-Math.sqrt(((cx-bodyCx)/bodyRx)**2+((cy-bodyCy)/bodyRy)**2)*.5):.6;
        hue=18+dep*34;sat=84+dep*12;lum=36+dep*36;al=.52+dep*.4;lw=1.1;
      }else if(inBody){
        // 身體中景：藍青
        const d2=Math.sqrt(bex*bex+bey*bey);
        const dep=Math.max(0,1-d2);
        hue=172+dep*22;sat=55+dep*18;lum=20+dep*22;al=.18+dep*.24;lw=.52;
      }else{
        // 背景：深藍紫
        const bg=Math.min(1,Math.sqrt(bex*bex+bey*bey)/2.5);
        hue=226+bg*34;sat=30-bg*12;lum=9+bg*6;al=.07+(1-bg)*.09;lw=.3;
      }

      ctx.strokeStyle=`hsla(${hue},${sat}%,${lum}%,${al})`;ctx.lineWidth=lw;
      ctx.strokeRect(gx,gy,GS,GS);
      const spT=inFace?.86:inBody?.955:.984;
      if(Math.random()>spT){
        ctx.fillStyle=`hsla(${hue},${sat}%,${lum+24}%,${al+.38})`;
        ctx.font=`${inFace?9:7}px Share Tech Mono`;
        ctx.fillText(Math.random().toString(16).slice(2,4).toUpperCase(),gx+4,gy+14);
      }
    }
  }

  // 臉部光暈
  if(S.lm&&S.conf>.3){
    const ns=lp(LM.noseTip);
    if(ns){
      const rg=ctx.createRadialGradient(ns.x,ns.y,4,ns.x,ns.y,bodyRx*.9);
      rg.addColorStop(0,'rgba(255,175,50,.14)');rg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
    }
  }
}

// 點是否在多邊形內（射線法）
function pointInPoly(px,py,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;
    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}

// ════════════════════════════════════════════════
//  STAGE 3 — FACE REWRITE
//  MediaPipe lm → 精確五官位置 → 貼圖
// ════════════════════════════════════════════════

// 五官錨點定義：用 FaceMesh landmark index 定位
// center: 中心點 landmark index
// refA/refB: 用來計算尺寸的兩個reference點
// scaleW/scaleH: ref距離的倍數 = 顯示寬高
const PARTS_DEF={
  // scaleW/H = refA↔refB 距離的倍數；maxW/H = 畫面寬/高的最大比例上限
  eyes_L:{type:'eyes',  center:[33,133],  refA:33, refB:133, scaleW:2.8, scaleH:1.9, maxW:.18, maxH:.12, rot:0},
  eyes_R:{type:'eyes',  center:[362,263], refA:362,refB:263, scaleW:2.8, scaleH:1.9, maxW:.18, maxH:.12, rot:0},
  nose:  {type:'nose',  center:[1],       refA:49, refB:279, scaleW:2.1, scaleH:2.6, maxW:.16, maxH:.20, rot:0},
  mouth: {type:'mouth', center:[0,17],    refA:61, refB:291, scaleW:2.3, scaleH:2.0, maxW:.20, maxH:.14, rot:0},
  ears_L:{type:'ears',  center:[127,234], refA:127,refB:172, scaleW:1.6, scaleH:2.0, maxW:.13, maxH:.18, rot:-.12},
  ears_R:{type:'ears',  center:[356,454], refA:356,refB:397, scaleW:1.6, scaleH:2.0, maxW:.13, maxH:.18, rot:.12},
};
const PORDER=['ears_L','ears_R','nose','mouth','eyes_L','eyes_R'];
const PCOL={eyes_L:'#00eeff',eyes_R:'#00eeff',nose:'#ff44cc',mouth:'#ffcc00',ears_L:'#88aaff',ears_R:'#88aaff'};

function buildFrags(){
  S.frags=[];
  PORDER.forEach(key=>{
    const D=PARTS_DEF[key];
    for(let c=0;c<S.density;c++){
      const spread=c===0?0:c*.08;
      S.frags.push({
        key,def:D,
        imgIdx:~~(Math.random()*PCOUNT),
        // 漂浮偏移（以faceScale為單位）
        driftX:(Math.random()-.5)*spread,
        driftY:(Math.random()-.5)*spread,
        vdx:0,vdy:0,
        // 3D旋轉
        rX:(Math.random()-.5)*30,rY:(Math.random()-.5)*30,rZ:(Math.random()-.5)*10,
        rsX:(Math.random()-.5)*.25,rsY:(Math.random()-.5)*.20,rsZ:(Math.random()-.5)*.15,
        // Z深度
        z:Math.random()*160-80,vz:(Math.random()-.5)*.6,
        // glitch
        gt:~~(Math.random()*80),gd:0,gox:0,goy:0,gs:1,
        alpha:.88+Math.random()*.12,
        layer:c,
      });
    }
  });
  S.fragDirty=false;

  // 定時換圖
  clearInterval(S._swapIv);
  S._swapIv=setInterval(()=>{
    if(S.frags.length){
      const f=S.frags[~~(Math.random()*S.frags.length)];
      f.imgIdx=~~(Math.random()*PCOUNT);
    }
  },1600);
  log('FRAGS: '+S.frags.length);
}

function stage3(W,H){
  const t=S.frame*.016,dist=S.dist;

  // 原臉殘影
  ctx.save();ctx.globalAlpha=.12+dist*.04;ctx.scale(-1,1);ctx.drawImage(vid,-W,0,W,H);ctx.restore();

  if(!S.lm||S.conf<.12){
    ctx.save();ctx.globalAlpha=.4+Math.sin(t*3)*.2;
    ctx.fillStyle='#ff4';ctx.font='bold 11px Orbitron';ctx.textAlign='center';
    ctx.shadowBlur=14;ctx.shadowColor='#ff4';
    ctx.fillText('FACE SEARCHING...',W/2,H/2);
    ctx.font='9px Share Tech Mono';
    ctx.fillText('靠近攝影機 | 確認光線充足',W/2,H/2+20);
    ctx.textAlign='start';ctx.restore();
    return;
  }

  // 計算臉部參考尺度（鼻尖到下巴的距離作為 faceScale）
  const noseTip=lp(LM.noseTip);
  const chin=lp(LM.chinBot);
  const faceScale=noseTip&&chin?dist2(noseTip,chin):H*.18;

  // 排序：z 小的先畫（遠）
  S.frags.sort((a,b)=>a.z-b.z);

  S.frags.forEach(fr=>{
    const D=fr.def;
    const imgs2=imgs[D.type];
    if(!imgs2)return;
    const img=imgs2[fr.imgIdx%imgs2.length];
    if(!img||!img.complete||img.naturalWidth===0)return;

    // ── 計算錨點中心位置 ──
    let cx=0,cy=0,ccount=0;
    D.center.forEach(idx=>{
      const p=lp(idx);
      if(p){cx+=p.x;cy+=p.y;ccount++;}
    });
    if(ccount===0)return;
    cx/=ccount;cy/=ccount;

    // ── 計算顯示尺寸（基於兩個reference點的距離）──
    const pA=lp(D.refA),pB=lp(D.refB);
    const refD=pA&&pB?dist2(pA,pB):faceScale*.3;
    let dw=refD*D.scaleW;
    let dh=refD*D.scaleH;

    // ── 上限鉗制：不超過畫面的 maxW/maxH 比例 ──
    if(D.maxW){ const cap=D.maxW*W; if(dw>cap){const r=cap/dw;dw=cap;dh*=r;} }
    if(D.maxH){ const cap=D.maxH*H; if(dh>cap){const r=cap/dh;dh=cap;dw*=r;} }

    // ── 物理漂浮 ── 朝中心靠（吸引力）
    fr.vdx+=(fr.driftX*faceScale-fr.driftX*faceScale)*.0; // 靜止吸引
    // 異化波動
    const wAmp=dist*dist*faceScale*.08;
    fr.vdx+=Math.sin(t*.85+fr.rZ*.1)*wAmp*.18;
    fr.vdy+=Math.cos(t*.65+fr.rX*.1)*wAmp*.15;
    const damp=.84-dist*.12;
    fr.vdx*=damp;fr.vdy*=damp;
    fr.driftX+=fr.vdx;fr.driftY+=fr.vdy;
    // 漂浮限制（不超過 faceScale 的 20%）
    const maxD=faceScale*.18;
    fr.driftX=Math.max(-maxD,Math.min(maxD,fr.driftX));
    fr.driftY=Math.max(-maxD,Math.min(maxD,fr.driftY));

    // Z 深度
    fr.vz+=(Math.random()-.5)*.06;fr.vz*=.94;
    fr.z+=fr.vz;fr.z=Math.max(-80,Math.min(80,fr.z));

    // 3D旋轉
    const rm=1+dist*dist*3.5;
    fr.rX+=fr.rsX*rm;fr.rY+=fr.rsY*rm;fr.rZ+=fr.rsZ*(1+dist*2);

    // Glitch
    fr.gt--;
    if(fr.gt<=0){
      const gf=Math.max(6,60-dist*56);
      fr.gt=gf+~~(Math.random()*gf);
      fr.gox=(Math.random()-.5)*dist*dist*dw*.4;
      fr.goy=(Math.random()-.5)*dist*dist*dh*.25;
      fr.gs=1+(Math.random()-.5)*dist*.45;
      fr.gd=2+~~(Math.random()*(2+dist*7));
    }
    const gl=fr.gd>0;if(gl)fr.gd--;

    // ── 透視 ──
    const persp=500/(500+fr.z);
    dw*=persp*(gl?fr.gs:1);
    dh*=persp;
    const zN=Math.max(0,Math.min(1,(fr.z+80)/160));

    const drawX=cx+fr.driftX+(gl?fr.gox:0);
    const drawY=cy+fr.driftY+(gl?fr.goy:0);

    const col=PCOL[fr.key]||'#fff';
    const cr=parseInt(col.slice(1,3),16),cg=parseInt(col.slice(3,5),16),cb2=parseInt(col.slice(5,7),16);

    ctx.save();
    ctx.translate(drawX,drawY);
    ctx.rotate(D.rot+fr.rZ*Math.PI/180*.45);
    // 3D 傾斜
    const skX=Math.sin(fr.rY*Math.PI/180)*.4;
    const scXY=Math.abs(Math.cos(fr.rY*Math.PI/180));
    const skY=Math.sin(fr.rX*Math.PI/180)*.3;
    const scYX=Math.abs(Math.cos(fr.rX*Math.PI/180));
    ctx.transform(scXY,skY,skX,scYX,0,0);

    // 立體陰影
    ctx.shadowOffsetX=zN*7;ctx.shadowOffsetY=zN*9;
    ctx.shadowBlur=7+zN*16;ctx.shadowColor='rgba(0,0,0,.7)';
    // 耳朵額外降透明度（避免搶占視覺）
    const earFade=(fr.key==='ears_L'||fr.key==='ears_R')?.72:1;
    ctx.globalAlpha=fr.alpha*(.5+zN*.45)*earFade;
    ctx.drawImage(img,-dw/2,-dh/2,dw,dh);

    // 彩色邊框
    ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
    ctx.shadowBlur=(6+zN*12)*(.38+dist*.62);ctx.shadowColor=col;
    ctx.strokeStyle=`rgba(${cr},${cg},${cb2},${.28+zN*.48})`;
    ctx.lineWidth=.6+zN*.7;ctx.strokeRect(-dw/2,-dh/2,dw,dh);

    // 角落標記（近的才畫）
    if(zN>.38){
      const cs=4,hx=dw/2,hy=dh/2;
      ctx.strokeStyle=`rgba(${cr},${cg},${cb2},${.5+zN*.35})`;ctx.lineWidth=1.1;ctx.shadowBlur=5;
      ctx.beginPath();
      ctx.moveTo(-hx,-hy+cs);ctx.lineTo(-hx,-hy);ctx.lineTo(-hx+cs,-hy);
      ctx.moveTo(hx-cs,-hy);ctx.lineTo(hx,-hy);ctx.lineTo(hx,-hy+cs);
      ctx.moveTo(hx,hy-cs);ctx.lineTo(hx,hy);ctx.lineTo(hx-cs,hy);
      ctx.moveTo(-hx+cs,hy);ctx.lineTo(-hx,hy);ctx.lineTo(-hx,hy-cs);
      ctx.stroke();
      if(zN>.62&&fr.layer===0){
        ctx.fillStyle=col;ctx.font='6px Orbitron';ctx.shadowBlur=4;
        ctx.fillText(fr.key.replace('_',' ').toUpperCase(),-hx,-hy-3);
      }
    }

    // 玻璃高光
    if(zN>.28){
      const gi=zN*(.4+Math.abs(Math.sin(fr.rY*Math.PI/180))*.28);
      const gg=ctx.createLinearGradient(-dw/2,-dh/2,-dw/2+dw*.44,-dh/2+dh*.44);
      gg.addColorStop(0,`rgba(255,255,255,${.68*gi})`);
      gg.addColorStop(.5,`rgba(255,255,255,${.22*gi})`);
      gg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.globalCompositeOperation='screen';ctx.globalAlpha=gi*.65;
      ctx.fillStyle=gg;ctx.fillRect(-dw/2,-dh/2,dw*.44,dh*.44);
      ctx.globalCompositeOperation='source-over';
    }

    // Glitch 撕裂線
    if(gl&&dist>.15){
      ctx.strokeStyle=`rgba(${cr},${cg},${cb2},.5)`;ctx.lineWidth=.8;
      ctx.globalCompositeOperation='screen';ctx.globalAlpha=.6;
      const ly=-dh/2+Math.random()*dh;
      ctx.beginPath();ctx.moveTo(-dw/2,ly);ctx.lineTo(dw/2,ly);ctx.stroke();
      ctx.globalCompositeOperation='source-over';
    }

    ctx.restore();
  });

  // 臉部準線
  if(noseTip){
    ctx.save();ctx.globalAlpha=.2+S.conf*.18;
    ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=.6;ctx.shadowBlur=5;ctx.shadowColor='#fff';
    ctx.beginPath();ctx.moveTo(noseTip.x-11,noseTip.y);ctx.lineTo(noseTip.x+11,noseTip.y);
    ctx.moveTo(noseTip.x,noseTip.y-11);ctx.lineTo(noseTip.x,noseTip.y+11);ctx.stroke();
    ctx.restore();
  }
}

// ════════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════════
function log(msg){
  const el=document.getElementById('log');
  if(el)el.innerHTML=`<span style="color:rgba(255,255,255,.38)">></span> ${msg}<br>${el.innerHTML.split('<br>').slice(0,2).join('<br>')}`;
}
function resize(){
  const c=document.getElementById('sc');
  if(c){canvas.width=c.clientWidth;canvas.height=c.clientHeight;}
}
window.onload=init;
</script>
